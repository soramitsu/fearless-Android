apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlinx-serialization'

android {
    namespace 'jp.co.soramitsu.fearless_utils'
    compileSdkVersion rootProject.compileSdkVersion
    defaultConfig {
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion rootProject.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    kotlinOptions { jvmTarget = JavaVersion.VERSION_21.toString() }
    sourceSets {
        test.java.srcDirs += "$projectDir/src/testShared/java"
        androidTest.java.srcDirs += "$projectDir/src/testShared/java"
    }
}

// Native sr25519 binaries remain app-owned under app/src/main/jniLibs, with
// source and binary provenance recorded in docs/binary-provenance.md.
// The SCALE codec (package io.emeraldpay.polkaj.scale) is polkaj-scale 0.2.3 built from source here.
dependencies {
    // Key-path cryptography: BIP39 PBKDF2, Ed25519, scrypt and xsalsa20-poly1305.
    implementation libs.bouncycastle
    implementation "com.caverock:androidsvg-aar:1.4"
    implementation project(':runtime-websocket')
    implementation libs.gson
    implementation "org.web3j:crypto:4.6.0-android"
    implementation "org.lz4:lz4-java:1.7.1"
    implementation libs.coroutines.core
    implementation libs.kotlinx.serialization.json
    testImplementation libs.junit
    // Reference implementations for the differential tests of the code that replaced them.
    testImplementation "com.madgag.spongycastle:prov:1.58.0.0"
    testImplementation "net.i2p.crypto:eddsa:0.3.0"
    testImplementation libs.ton.crypto
    testImplementation libs.ton.tonapi
    testImplementation libs.ton.tvm
    testImplementation "net.bytebuddy:byte-buddy:1.18.10"
    testImplementation "net.bytebuddy:byte-buddy-agent:1.18.10"
    testImplementation "org.mockito:mockito-inline:5.2.0"
    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "org.mockito:mockito-android:4.5.0"
    androidTestImplementation "androidx.test:rules:1.5.0"
    androidTestImplementation "androidx.test.ext:junit:1.1.5"
}

// Legacy upstream integration tests include real extrinsic submission. They are
// excluded from ordinary host tests; all runtime validation here uses local fixtures.
tasks.withType(Test).configureEach {
    exclude '**/integration/**'
}
