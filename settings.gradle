// Prefer a local fearless-utils-Android checkout when available.
def localUtilsPath = System.getenv("FEARLESS_UTILS_PATH")
if (localUtilsPath == null || localUtilsPath.trim().isEmpty()) {
    def localUtilsCandidates = [
            new File(rootDir, "fearless-utils-Android"),
            new File(rootDir, "../fearless-utils-Android")
    ]
    localUtilsPath = (localUtilsCandidates.find { it.exists() } ?: localUtilsCandidates.last()).canonicalPath
}
def localUtilsDir = new File(localUtilsPath)
// Enable the experimental Git source dependency fallback by setting -PUSE_REMOTE_UTILS=true or USE_REMOTE_UTILS=true.
// Public CI uses an explicit pinned checkout instead because Gradle sourceControl does not resolve every published version.
def useRemoteUtils = (
        providers.gradleProperty("USE_REMOTE_UTILS").orNull?.toBoolean()
                ?: System.getenv("USE_REMOTE_UTILS")?.toBoolean()
                ?: false
)

def forceLocalUtils = (
        providers.gradleProperty("FORCE_LOCAL_UTILS").orNull?.toBoolean() ?: false
) || (System.getenv("FORCE_LOCAL_UTILS") == "true")

def gradleMajorVersion = gradle.gradleVersion.tokenize('.').first().toInteger()
// The compatibility shims above keep the pinned fearless-utils checkout usable
// through Gradle 9. Future Gradle majors must opt in with FORCE_LOCAL_UTILS until
// the included build is verified again.
def localUtilsSupported = gradleMajorVersion < 10

if (localUtilsDir.exists() && (localUtilsSupported || forceLocalUtils)) {
    println("Including local fearless-utils from: ${localUtilsDir}")
    includeBuild(localUtilsDir) {
        dependencySubstitution {
            substitute module("jp.co.soramitsu.fearless-utils:fearless-utils") using project(":fearless-utils")
        }
    }
} else if (localUtilsDir.exists() && !forceLocalUtils && !localUtilsSupported) {
    println("Skipping local fearless-utils because Gradle ${gradle.gradleVersion} is not verified with its build scripts. Set FORCE_LOCAL_UTILS=true to override.")
    if (useRemoteUtils) {
        println("Using remote fearless-utils from GitHub via sourceControl")
        sourceControl {
            gitRepository("https://github.com/soramitsu/fearless-utils-Android.git") {
                producesModule("jp.co.soramitsu.fearless-utils:fearless-utils")
            }
        }
    } else {
        println("No remote fallback configured; published artifacts will be used.")
    }
} else if (useRemoteUtils) {
    println("Including remote fearless-utils from GitHub via sourceControl")
    sourceControl {
        gitRepository("https://github.com/soramitsu/fearless-utils-Android.git") {
            producesModule("jp.co.soramitsu.fearless-utils:fearless-utils")
        }
    }
} else {
    println("No local fearless-utils checkout found; using published artifacts")
}
