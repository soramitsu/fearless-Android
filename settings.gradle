def verifyRuntimeSources = {
    def sourceCheck = new ProcessBuilder("python3", new File(rootDir, "scripts/verify-android-runtime-sources.py").absolutePath)
    sourceCheck.directory(rootDir)
    sourceCheck.redirectErrorStream(true)
    def process = sourceCheck.start()
    def sourceOutput = process.inputStream.getText("UTF-8")
    if (process.waitFor() != 0) throw new GradleException("Android source verification failed: " + sourceOutput)
    println(sourceOutput.trim())
}
if (ciEnvironment || explicitReleaseTaskRequested) {
    verifyRuntimeSources()
    gradle.buildFinished { result ->
        if (result.failure == null) verifyRuntimeSources()
    }
}

gradle.taskGraph.whenReady { graph ->
    if (!ciEnvironment && !explicitReleaseTaskRequested && !localVerificationBootstrapRequested &&
            graph.allTasks.any { it.name.toLowerCase(Locale.ROOT).contains("release") }) {
        throw new GradleException("Use the full release task name so app-owned sources are checked before project configuration.")
    }
}
