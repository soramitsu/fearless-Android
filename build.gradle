import java.util.Properties
import org.gradle.api.artifacts.dsl.LockMode

def versionPropsFile = file("versioning/version.properties")
if (!versionPropsFile.exists()) {
    throw new GradleException("Missing versioning/version.properties. Please create it with versionName and versionCode entries.")
}

def versionProps = new Properties()
versionPropsFile.withInputStream { versionProps.load(it) }

def configuredVersionName = versionProps["versionName"]
def configuredVersionCode = versionProps["versionCode"]?.toInteger()
if (configuredVersionName == null || configuredVersionName.trim().isEmpty()) {
    throw new GradleException("versioning/version.properties must contain a non-empty versionName.")
}
if (configuredVersionCode == null || configuredVersionCode <= 0) {
    throw new GradleException("versioning/version.properties must contain a positive versionCode.")
}

ext {
    versionName = configuredVersionName
    versionCode = configuredVersionCode
}

buildscript {
    dependencyLocking {
        lockMode = LockMode.STRICT
    }

    configurations.classpath {
        resolutionStrategy.activateDependencyLocking()
    }

    ext {
        // SDK and tools
        compileSdkVersion = 36
        minSdkVersion = 26
        targetSdkVersion = 36

        // Closure to exclude JNA from 3rd party dependencies to prevent class duplication
        // JNA is added as direct dependency where needed to avoid "missing class" errors
        withoutJna = { exclude group: 'net.java.dev.jna' }
        withoutPay = { exclude group: 'com.walletconnect', module: 'pay' }
        withoutJnaAndPay = {
            exclude group: 'net.java.dev.jna'
            exclude group: 'com.walletconnect', module: 'pay'
        }
        withoutJavaWS = { exclude module: 'java-websocket-lib' }
    }

    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://plugins.gradle.org/m2/") }
        maven { url = uri('https://maven.google.com') }
    }
    dependencies {
        classpath libs.gradleplugins.android
        classpath libs.gradleplugins.kotlin
        classpath libs.kotlin.serialization
        classpath libs.google.services
        classpath libs.firebase.appdistribution.gradle
        classpath libs.gradleplugins.compose
        classpath libs.org.jacoco.core
        classpath libs.sonarqube.gradle.plugin
    }

    configurations.configureEach {
        resolutionStrategy {
            cacheChangingModulesFor 0, 'seconds'
        }
    }
}


apply from: './scripts/secrets.gradle'
apply plugin: "detekt-setup"
apply plugin: "org.sonarqube"

allprojects {
    if (!gradle.ext.fearlessDependencyProvenanceRequired) {
        repositories {
            google()
            if (gradle.ext.fearlessMavenLocalAllowed) {
                mavenLocal {
                    content {
                        includeGroupByRegex "jp[.]co[.]soramitsu([.].*)?"
                    }
                }
                gradle.ext.fearlessMavenLocalConfigured = true
            }
            mavenCentral()
            exclusiveContent {
                forRepository {
                    maven {
                        name = "JitPack"
                        url = uri("https://jitpack.io")
                    }
                }
                filter {
                    includeGroup "com.github.ildixhaferri"
                    includeGroupByRegex "com[.]github[.]komputing([.].*)?"
                    includeGroup "com.github.multiformats"
                    includeGroup "com.walletconnect.Scarlet"
                }
            }
        }
    }

    configurations {
        cleanedAnnotations
    }
    configurations.configureEach { configuration ->
        if (configuration.name == 'implementation') {
            configuration.exclude group: 'com.intellij', module: 'annotations'
        }
    }

    // The staged Iroha bridge and its smoke test resolve their own checksum-pinned
    // graph (see iroha-sdk-bridge/build.gradle); they are not part of the app.
    def resolvesStagedIrohaBridge = project.path in [':iroha-sdk-bridge', ':iroha-sdk-bridge-kotlin-smoke']

    configurations.configureEach { configuration ->
        resolutionStrategy {
            // add dependency substitution rules
            eachDependency { DependencyResolveDetails details ->
                if (details.requested.group == 'com.madgag.spongycastle' && details.requested.name in ['bcpkix-jdk15on', 'bcpg-jdk15on']) {
                    // fearless-utils only imports provider/core primitives. Keep the
                    // required provider while excluding unused PKIX/PGP jars; the
                    // legacy PKIX artifact bundles a trust-all TLS helper that must
                    // never be packaged in the wallet.
                    details.useTarget('com.madgag.spongycastle:prov:1.58.0.0')
                }
                if (details.requested.group == 'org.bouncycastle' &&
                        details.requested.name in ['bcprov-jdk15on', 'bcprov-jdk18on'] &&
                        !resolvesStagedIrohaBridge) {
                    // bcprov-jdk18on 1.78.1 has CVE-2025-14813 (GOST CTR keystream
                    // reuse), CVE-2026-0636 (LDAP injection), CVE-2026-8763 (name
                    // constraints bypass) and CVE-2026-13506 (ASN.1 nesting-depth guard
                    // reset); 1.85 is the first release without any of them. The wallet
                    // uses digests, encoders and EC/Ed25519 primitives only.
                    details.useTarget('org.bouncycastle:bcprov-jdk18on:1.85')
                    details.because('CVE-2025-14813, CVE-2026-0636, CVE-2026-8763, CVE-2026-13506: bcprov-jdk18on before 1.85')
                }
                if (details.requested.group == 'org.java-websocket' && details.requested.name == 'Java-WebSocket') {
                    // CVE-2020-11050 / GHSA-gw55-jm4h-x339: Java-WebSocket before 1.5.0
                    // never checks that the TLS certificate names the dialed host, so
                    // any publicly trusted certificate could impersonate a wss:// EVM
                    // RPC node. web3j core 4.8.8-android still requests 1.3.8. From
                    // 1.5.0 the client enables HTTPS endpoint identification, which
                    // Android supports from API 24 (minSdk is 26).
                    details.useVersion('1.6.0')
                    details.because('CVE-2020-11050: Java-WebSocket before 1.5.0 skips TLS hostname verification')
                }
                if (details.requested.group == 'org.lz4' && details.requested.name == 'lz4-java') {
                    // org.lz4:lz4-java stopped at 1.8.0 (1.8.1 only relocates);
                    // at.yawk.lz4:lz4-java is its maintained drop-in with the same
                    // net.jpountz API. 1.11.4 is the first release without CVE-2025-12183,
                    // CVE-2025-66566, CVE-2026-59949 and CVE-2026-106449 to CVE-2026-106453.
                    details.useTarget('at.yawk.lz4:lz4-java:1.11.4')
                    details.because('CVE-2025-12183, CVE-2025-66566: org.lz4:lz4-java is unmaintained; at.yawk.lz4 1.11.4 fixes every listed lz4-java advisory')
                }
                if (details.requested.group == 'commons-beanutils' && details.requested.name == 'commons-beanutils') {
                    // CVE-2025-48734: before 1.11.0, PropertyUtilsBean exposes the
                    // declaredClass property, so a crafted property path reaches the class
                    // loader. opencsv depends on it; the app only uses opencsv to read the
                    // phishing list CSV by header.
                    details.useVersion('1.11.0')
                    details.because('CVE-2025-48734: commons-beanutils before 1.11.0 exposes declaredClass')
                }
                if (details.requested.group.startsWith('com.fasterxml.jackson') && !resolvesStagedIrohaBridge) {
                    // web3j parses untrusted RPC replies. Keep the Jackson 2.x family aligned;
                    // 2.18.11 includes bounded nesting and the subsequent 2026 parser fixes.
                    details.useVersion('2.18.11')
                    details.because('CVE-2025-52999 and 2026 Jackson advisories: bound untrusted RPC JSON parsing')
                }
                if (details.requested.group == 'com.google.guava' && details.requested.name == 'guava') {
                    // The Java API client requests Guava JRE. Select the Android variant
                    // for Android compile/runtime graphs; compiler/plugin graphs stay separate.
                    def androidClasspath = (
                            project.plugins.hasPlugin('com.android.application') ||
                                    project.plugins.hasPlugin('com.android.library')
                    ) && (
                            configuration.name.endsWith('CompileClasspath') ||
                                    configuration.name.endsWith('RuntimeClasspath')
                    )
                    details.useVersion(androidClasspath ? '33.4.8-android' :
                            (details.requested.version?.endsWith('-jre') ? '33.3.1-jre' : '33.3.1-android'))
                    details.because('CVE-2020-8908, CVE-2023-2976: private temporary files in Guava')
                }
                if (details.requested.group == 'org.apache.commons' && details.requested.name == 'commons-lang3') {
                    details.useVersion('3.18.0')
                    details.because('CVE-2025-48924: reject excessively nested class names without unbounded recursion')
                }
            }

            // Force native-heavy dependencies to versions built with 16 KB page support.
            def forcedTensorflowVersion = "2.16.1"
            force "org.tensorflow:tensorflow-lite:${forcedTensorflowVersion}"
            force "org.tensorflow:tensorflow-lite-api:${forcedTensorflowVersion}"

            def forcedCameraVersion = "1.4.0"
            [
                    "camera-core",
                    "camera-camera2",
                    "camera-extensions",
                    "camera-lifecycle",
                    "camera-video",
                    "camera-view"
            ].each { moduleName ->
                force "androidx.camera:${moduleName}:${forcedCameraVersion}"
            }
        }
    }

    if (project.path == ":app") {
        def productionReleaseLockConfigurations = [
                "hiltAnnotationProcessorRelease",
                "hiltAnnotationProcessorInternalAppSharing",
                "kotlinCompilerPluginClasspathRelease",
                "kotlinCompilerPluginClasspathInternalAppSharing",
                "kspReleaseKotlinProcessorClasspath",
                "kspInternalAppSharingKotlinProcessorClasspath",
                "releaseAnnotationProcessorClasspath",
                "releaseCompileClasspath",
                "releaseRuntimeClasspath",
                "internalAppSharingAnnotationProcessorClasspath",
                "internalAppSharingCompileClasspath",
                "internalAppSharingRuntimeClasspath"
        ] as Set
        dependencyLocking {
            lockMode = LockMode.STRICT
        }
        configurations.configureEach { configuration ->
            if (productionReleaseLockConfigurations.contains(
                    configuration.name
            )) {
                configuration.resolutionStrategy.activateDependencyLocking()
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

def unitTestTaskPaths = [
        ':app:testDebugUnitTest',
        ':common:testDebugUnitTest',
        ':core-api:testDebugUnitTest',
        ':core-db:testDebugUnitTest',
        ':feature-account-api:testDebugUnitTest',
        ':feature-account-impl:testDebugUnitTest',
        ':feature-crowdloan-impl:testDebugUnitTest',
        ':feature-onboarding-impl:testDebugUnitTest',
        ':feature-liquiditypools-impl:testDebugUnitTest',
        ':feature-polkamarkt-impl:testDebugUnitTest',
        ':feature-polkaswap-impl:testDebugUnitTest',
        ':feature-staking-impl:testDebugUnitTest',
        ':feature-tonconnect-api:testDebugUnitTest',
        ':feature-tonconnect-impl:testDebugUnitTest',
        ':feature-wallet-api:testDebugUnitTest',
        ':feature-wallet-impl:testDebugUnitTest',
        ':feature-walletconnect-impl:testDebugUnitTest',
        ':core-backup:testDebugUnitTest',
        ':core-xcm:testDebugUnitTest',
        ':runtime-utils:testDebugUnitTest',
        ':runtime-websocket:test',
        ':runtime:testDebugUnitTest'
]
// These pure-JVM tests require an explicitly materialized, checksum-pinned
// upstream archive. They are intentionally outside runTest because runTest's
// clean prerequisite deletes build/iroha-mobile-sdk and ordinary builds must
// never download release assets implicitly.
def stagedIrohaTestTaskPaths = [
        ':iroha-sdk-bridge:test',
        ':iroha-sdk-bridge-kotlin-smoke:test'
]
def jacocoReportTaskPaths = [
        ':feature-account-impl:jacocoTestReport',
        ':feature-crowdloan-impl:jacocoTestReport',
        ':feature-onboarding-impl:jacocoTestReport',
        ':feature-staking-impl:jacocoTestReport',
        ':feature-wallet-impl:jacocoTestReport'
]

tasks.register('runTest') {
    group = 'verification'
    description = 'Runs clean -> detekt -> module tests -> jacoco in order.'
    dependsOn 'clean', 'detektAll'
    dependsOn unitTestTaskPaths
    dependsOn jacocoReportTaskPaths
}

tasks.register('runStagedIrohaBridgeTests') {
    group = 'verification'
    description = 'Runs staged Iroha bridge tests after explicit SDK materialization.'
    dependsOn stagedIrohaTestTaskPaths
}

// Helper: print effective Polkadot SDK alignment overrides and defaults
tasks.register('printPolkadotSdkAlignment') {
    group = 'help'
    description = 'Prints effective overrides for types/chains registries for app-owned configuration.'
    doLast {
        def typesUrlDefault = 'https://raw.githubusercontent.com/soramitsu/fearless-Android/master/remote-config/production/chains/all_chains_types_android.json'
        def defaultV13TypesUrlDefault = 'https://raw.githubusercontent.com/soramitsu/fearless-Android/master/remote-config/production/chains/default_v13_types.json'
        def chainsUrlDebugDefault = 'https://raw.githubusercontent.com/soramitsu/fearless-Android/master/remote-config/development/chains/v13/chains_dev_prod.json'
        def chainsUrlReleaseDefault = 'https://raw.githubusercontent.com/soramitsu/fearless-Android/master/remote-config/production/chains/v13/chains.json'

        def typesUrl = readOptionalSecret('TYPES_URL_OVERRIDE') ?: typesUrlDefault
        def defaultV13TypesUrl = readOptionalSecret('DEFAULT_V13_TYPES_URL_OVERRIDE') ?: defaultV13TypesUrlDefault
        def chainsUrlDebug = readOptionalSecret('CHAINS_URL_DEBUG_OVERRIDE') ?: chainsUrlDebugDefault
        def chainsUrlRelease = chainsUrlReleaseDefault

        println("Polkadot SDK alignment (effective):")
        println(" - TYPES_URL: ${typesUrl}")
        println(" - DEFAULT_V13_TYPES_URL: ${defaultV13TypesUrl}")
        println(" - CHAINS_URL (debug): ${chainsUrlDebug}")
        println(" - CHAINS_URL (release): ${chainsUrlRelease}")
        // Type registry overrides apply to debug builds only; release builds read the reviewed registries.
        println(" - TYPES_URL (release): ${typesUrlDefault}")
        println(" - DEFAULT_V13_TYPES_URL (release): ${defaultV13TypesUrlDefault}")
    }
}

// Aggregated post-merge checks to validate build and alignment (strict order, no cross-task lookups)
tasks.register('postMergeCheck') {
    group = 'verification'
    description = 'Print alignment, run tests, assemble debug, then lint in sequence.'
    dependsOn 'printPolkadotSdkAlignment', 'runTest', ':app:lint'
}

gradle.projectsEvaluated {
    tasks.named('runTest').configure {
        mustRunAfter('printPolkadotSdkAlignment')
    }

    tasks.named('detektAll').configure { mustRunAfter('clean') }
    unitTestTaskPaths.each { taskPath ->
        tasks.findByPath(taskPath)?.mustRunAfter(tasks.named('detektAll').get())
    }
    jacocoReportTaskPaths.each { taskPath ->
        tasks.findByPath(taskPath)?.mustRunAfter(unitTestTaskPaths)
    }

    def appProject = project(':app')
    def appAssembleTaskName = ['assembleDevelopDebug', 'assembleDebug', 'assemble']
            .find { taskName -> appProject.tasks.findByName(taskName) != null }

    if (appAssembleTaskName != null) {
        tasks.named('postMergeCheck').configure {
            dependsOn(":app:${appAssembleTaskName}")
        }
        appProject.tasks.named(appAssembleTaskName).configure { mustRunAfter(':runTest') }
        appProject.tasks.named('lint').configure { mustRunAfter(":app:${appAssembleTaskName}") }
    } else {
        logger.warn("No app assemble task found for postMergeCheck ordering.")
    }
}

// Jenkins-friendly alias that avoids nested Gradle builds.
// Runs: clean -> alignment -> detekt -> tests -> assemble -> lint (ordered, in-process)
tasks.register('postMergeVerify') {
    group = 'verification'
    description = 'Alias: alignment -> tests -> assemble -> lint'
    dependsOn('clean')
    dependsOn('printPolkadotSdkAlignment')
    dependsOn('detektAll')
    dependsOn(':app:lint')
}

// After all projects are evaluated, wire test tasks and ordering to the alias
gradle.projectsEvaluated {
    // Collect available per-module unit test tasks
    def testTasks = subprojects.collect { p ->
        p.tasks.findByName('testDevelopDebugUnitTest') ?: p.tasks.findByName('testDebugUnitTest')
    }.findAll { it != null }

    def appProject = project(':app')
    // Prefer assembleDevelopDebug if present (custom build type), else assembleDebug, else fallback to assemble
    def appAssembleTaskName = ['assembleDevelopDebug', 'assembleDebug', 'assemble']
            .find { t -> appProject.tasks.findByName(t) != null }

    tasks.named('postMergeVerify') {
        dependsOn(testTasks)
        if (appAssembleTaskName != null) {
            dependsOn(":app:${appAssembleTaskName}")
        } else {
            logger.warn("No app assemble task found for postMergeVerify ordering.")
        }
    }

    // Ensure fast-fail order: detekt -> assemble -> lint -> tests
    if (appAssembleTaskName != null) {
        appProject.tasks.matching { it.name == appAssembleTaskName }.configureEach {
            mustRunAfter(':detektAll')
        }
    }
    appProject.tasks.matching { it.name == 'lint' }.configureEach {
        if (appAssembleTaskName != null) {
            mustRunAfter(":app:${appAssembleTaskName}")
        }
    }
    // Run unit tests after lint to avoid wasting time if lint fails
    testTasks.each { t ->
        t.mustRunAfter(':detektAll')
        if (appAssembleTaskName != null) {
            t.mustRunAfter(":app:${appAssembleTaskName}")
        }
        t.mustRunAfter(":app:lint")
    }
}
