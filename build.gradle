import java.util.Locale
import java.util.Properties

def versionPropsFile = file("versioning/version.properties")
if (!versionPropsFile.exists()) {
    throw new GradleException("Missing versioning/version.properties. Please create it with versionName and versionCode entries.")
}

def versionProps = new Properties()
versionPropsFile.withInputStream { versionProps.load(it) }

def requestedTasks = gradle.startParameter.taskNames
def normalizedTasks = requestedTasks.collect { it?.toLowerCase(Locale.ROOT) }
def releaseTaskMatchers = [
        ":app:assemblerelease",
        ":app:bundlerelease",
        ":app:publishrelease",
        ":app:publishreleasebundle",
        ":app:appdistributionuploadrelease",
        "assemblerelease",
        "bundlerelease",
        "publishrelease",
        "publishreleasebundle"
]

boolean isReleaseBuildRequested = normalizedTasks.any { task ->
    if (task == null) return false
    return releaseTaskMatchers.contains(task)
}

boolean skipAutoBump = (System.getenv("SKIP_AUTO_VERSION_BUMP") ?: (project.hasProperty("skipAutoVersionBump") ? project.property("skipAutoVersionBump") : null))?.toString()?.toBoolean() ?: false
boolean autoBumpAllowed = !skipAutoBump && System.getenv("CI_BUILD_ID") == null

if (autoBumpAllowed && isReleaseBuildRequested) {
    def currentCode = versionProps["versionCode"]?.toInteger()
    def bumpedCode = currentCode + 1
    versionProps["versionCode"] = bumpedCode.toString()
    versionPropsFile.withOutputStream { os ->
        versionProps.store(os, "Auto-bumped versionCode on ${new Date()}")
    }
    println("Auto-bumped versionCode to ${bumpedCode} because an app release build was requested.")
}

def configuredVersionName = versionProps["versionName"]
def configuredVersionCode = versionProps["versionCode"]?.toInteger()

ext {
    versionName = configuredVersionName
    versionCode = configuredVersionCode
}

buildscript {
    ext {
        // SDK and tools
        compileSdkVersion = 36
        minSdkVersion = 26
        targetSdkVersion = 35

        withoutBasic = { exclude group: 'jp.co.soramitsu.xnetworking', module: 'basic' }
        // Closure to exclude JNA from 3rd party dependencies to prevent class duplication
        // JNA is added as direct dependency where needed to avoid "missing class" errors
        withoutJna = { exclude group: 'net.java.dev.jna' }
        withoutPay = { exclude group: 'com.walletconnect', module: 'pay' }
        withoutJnaAndPay = {
            exclude group: 'net.java.dev.jna'
            exclude group: 'com.walletconnect', module: 'pay'
        }
        withoutJavaWS = { exclude module: 'java-websocket-lib' }
    }

    repositories {
        google()
        mavenCentral()
        maven { url = uri("https://plugins.gradle.org/m2/") }
        maven { url = uri('https://maven.google.com') }
    }
    dependencies {
        classpath libs.gradleplugins.android
        classpath libs.gradleplugins.kotlin
        classpath libs.kotlin.serialization
        classpath libs.google.services
        classpath libs.firebase.appdistribution.gradle
        classpath libs.play.publisher
        classpath libs.gradleplugins.compose
        classpath libs.org.jacoco.core
        classpath libs.sonarqube.gradle.plugin
    }

    configurations.configureEach {
        resolutionStrategy {
            cacheChangingModulesFor 0, 'seconds'
        }
    }
}


apply from: './scripts/secrets.gradle'
apply plugin: "detekt-setup"
apply plugin: "org.sonarqube"

allprojects {
    repositories {
        google()
        mavenLocal()
        maven { url = uri("https://nexus.iroha.tech/repository/maven-soramitsu/") }
        mavenCentral()
        maven { url = uri("https://jitpack.io") }

    }

    configurations {
        cleanedAnnotations
        implementation.exclude group: 'com.intellij' , module:'annotations'
    }

    configurations.configureEach {
        resolutionStrategy {
            // add dependency substitution rules
            eachDependency { DependencyResolveDetails details ->
                if (details.requested.group == 'org.bouncycastle' && details.requested.name == 'bcprov-jdk15on') {
                    details.useTarget("org.bouncycastle:bcprov-jdk18on:1.78")
                }
            }

            // Optional: pin shared_features libs to a specific version (e.g., for Polkadot SDK alignment)
            def sharedFeaturesVer = readSecret("SHARED_FEATURES_VERSION_OVERRIDE")
            if (sharedFeaturesVer) {
                force "jp.co.soramitsu.shared_features:core:${sharedFeaturesVer}"
                force "jp.co.soramitsu.shared_features:xcm:${sharedFeaturesVer}"
                force "jp.co.soramitsu.shared_features:backup:${sharedFeaturesVer}"
                println("Using SHARED_FEATURES_VERSION_OVERRIDE=${sharedFeaturesVer}")
            }

            // Force native-heavy dependencies to versions built with 16 KB page support.
            def forcedTensorflowVersion = "2.16.1"
            force "org.tensorflow:tensorflow-lite:${forcedTensorflowVersion}"
            force "org.tensorflow:tensorflow-lite-api:${forcedTensorflowVersion}"

            def forcedCameraVersion = "1.4.0"
            [
                    "camera-core",
                    "camera-camera2",
                    "camera-extensions",
                    "camera-lifecycle",
                    "camera-video",
                    "camera-view"
            ].each { moduleName ->
                force "androidx.camera:${moduleName}:${forcedCameraVersion}"
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}

tasks.register('runTest') {
    group = 'verification'
    description = 'Runs clean -> detekt -> module tests -> jacoco in order.'
    dependsOn 'clean', 'detektAll'
}

// Helper: print effective Polkadot SDK alignment overrides and defaults
tasks.register('printPolkadotSdkAlignment') {
    group = 'help'
    description = 'Prints effective overrides for types/chains registries and shared_features pinning.'
    doLast {
        def typesUrlDefault = 'https://raw.githubusercontent.com/soramitsu/shared-features-utils/master/chains/all_chains_types_android.json'
        def defaultV13TypesUrlDefault = 'https://raw.githubusercontent.com/soramitsu/shared-features-utils/master/chains/default_v13_types.json'
        def chainsUrlDebugDefault = 'https://raw.githubusercontent.com/soramitsu/shared-features-utils/develop-free/chains/v13/chains_dev_prod.json'
        def chainsUrlReleaseDefault = 'https://raw.githubusercontent.com/soramitsu/shared-features-utils/master/chains/v13/chains.json'

        def typesUrl = readSecret('TYPES_URL_OVERRIDE') ?: typesUrlDefault
        def defaultV13TypesUrl = readSecret('DEFAULT_V13_TYPES_URL_OVERRIDE') ?: defaultV13TypesUrlDefault
        def chainsUrlDebug = readSecret('CHAINS_URL_DEBUG_OVERRIDE') ?: (readSecret('CHAINS_URL_OVERRIDE') ?: chainsUrlDebugDefault)
        def chainsUrlRelease = readSecret('CHAINS_URL_RELEASE_OVERRIDE') ?: (readSecret('CHAINS_URL_OVERRIDE') ?: chainsUrlReleaseDefault)
        def sharedFeaturesVer = readSecret('SHARED_FEATURES_VERSION_OVERRIDE') ?: '(not pinned)'

        println("Polkadot SDK alignment (effective):")
        println(" - TYPES_URL: ${typesUrl}")
        println(" - DEFAULT_V13_TYPES_URL: ${defaultV13TypesUrl}")
        println(" - CHAINS_URL (debug): ${chainsUrlDebug}")
        println(" - CHAINS_URL (release): ${chainsUrlRelease}")
        println(" - SHARED_FEATURES_VERSION_OVERRIDE: ${sharedFeaturesVer}")
    }
}

// Aggregated post-merge checks to validate build and alignment (strict order, no cross-task lookups)
tasks.register('postMergeCheck') {
    group = 'verification'
    description = 'Print alignment, run tests, assemble debug, then lint in sequence.'
    dependsOn 'printPolkadotSdkAlignment', 'runTest', ':app:assembleDebug', ':app:lint'
}

gradle.projectsEvaluated {
    def moduleRunTests = []
    def moduleJacocoReports = []

    subprojects.each { proj ->
        proj.tasks.matching { it.name == 'runModuleTests' }.configureEach { moduleRunTests += it }
        proj.tasks.matching { it.name == 'jacocoTestReport' }.configureEach { moduleJacocoReports += it }
    }

    tasks.named('runTest').configure {
        dependsOn moduleJacocoReports
        mustRunAfter('printPolkadotSdkAlignment')
    }

    tasks.named('detektAll').configure { mustRunAfter('clean') }
    moduleRunTests.each { it.mustRunAfter(tasks.named('detektAll').get()) }
    moduleJacocoReports.each { report ->
        report.mustRunAfter(moduleRunTests)
    }

    project(':app').tasks.named('assembleDebug').configure { mustRunAfter(':runTest') }
    project(':app').tasks.named('lint').configure { mustRunAfter(':app:assembleDebug') }
}

// Jenkins-friendly alias that avoids nested Gradle builds.
// Runs: clean -> alignment -> detekt -> tests -> assemble -> lint (ordered, in-process)
tasks.register('postMergeVerify') {
    group = 'verification'
    description = 'Alias: alignment -> tests -> assemble -> lint'
    dependsOn('clean')
    dependsOn('printPolkadotSdkAlignment')
    dependsOn('detektAll')
    dependsOn(':app:assembleDebug')
    dependsOn(':app:lint')
}

// After all projects are evaluated, wire test tasks and ordering to the alias
gradle.projectsEvaluated {
    // Collect available per-module unit test tasks
    def testTasks = subprojects.collect { p ->
        p.tasks.findByName('testDevelopDebugUnitTest') ?: p.tasks.findByName('testDebugUnitTest')
    }.findAll { it != null }

    def appProject = project(':app')
    // Prefer assembleDevelopDebug if present (custom build type), else assembleDebug, else fallback to assemble
    def appAssembleTaskName = ['assembleDevelopDebug', 'assembleDebug', 'assemble']
            .find { t -> appProject.tasks.findByName(t) != null } ?: 'assemble'

    tasks.named('postMergeVerify') {
        dependsOn(testTasks)
        // Wire the chosen assemble task
        dependsOn(":app:${appAssembleTaskName}")
    }

    // Ensure fast-fail order: detekt -> assemble -> lint -> tests
    appProject.tasks.matching { it.name == appAssembleTaskName }.configureEach {
        mustRunAfter(':detektAll')
    }
    appProject.tasks.matching { it.name == 'lint' }.configureEach {
        mustRunAfter(":app:${appAssembleTaskName}")
    }
    // Run unit tests after lint to avoid wasting time if lint fails
    testTasks.each { t ->
        t.mustRunAfter(':detektAll')
        t.mustRunAfter(":app:${appAssembleTaskName}")
        t.mustRunAfter(":app:lint")
    }
}
