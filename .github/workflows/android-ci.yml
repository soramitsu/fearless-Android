name: Android CI

on:
  pull_request:
  push:
    branches: [ master, develop ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      FEARLESS_UTILS_COMMIT: 7500809f33243ee47ecb2ec8563fc284ac4de0d6
      FEARLESS_UTILS_PATH: ${{ github.workspace }}/fearless-utils-Android
      FORCE_LOCAL_UTILS: "true"
      FEARLESS_UTILS_LIBRARY_ONLY: "true"
      USE_REMOTE_UTILS: "false"
      SHARED_FEATURES_VERSION_OVERRIDE: ""
      # Provide safe stubs to avoid repository/config failures during resolution
      PAY_WINGS_REPOSITORY_URL: https://maven.google.com
      PAY_WINGS_USERNAME: ""
      PAY_WINGS_PASSWORD: ""
      MOONPAY_TEST_SECRET: stub
      MOONPAY_PRODUCTION_SECRET: stub
      FL_BLAST_API_ETHEREUM_KEY: stub
      FL_BLAST_API_BSC_KEY: stub
      FL_BLAST_API_SEPOLIA_KEY: stub
      FL_BLAST_API_GOERLI_KEY: stub
      FL_BLAST_API_POLYGON_KEY: stub
      FL_ANDROID_ETHERSCAN_API_KEY: stub
      FL_ANDROID_BSCSCAN_API_KEY: stub
      FL_ANDROID_POLYGONSCAN_API_KEY: stub

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout fearless-utils-Android
        uses: actions/checkout@v4
        with:
          repository: soramitsu/fearless-utils-Android
          ref: ${{ env.FEARLESS_UTILS_COMMIT }}
          path: fearless-utils-Android
          fetch-depth: 0

      - name: Verify fearless-utils source
        run: ./scripts/ensure-fearless-utils.sh

      - name: Branch flow audit
        run: |
          bash ./scripts/audit-branch-flow.sh
          bash ./scripts/test-branch-flow-audit.sh

      - name: Public artifact audit
        run: ./scripts/audit-public-artifacts.sh

      - name: TODO debt audit
        run: |
          bash ./scripts/test-todo-debt-audit.sh
          bash ./scripts/audit-todo-debt.sh

      - name: XCM registry metadata audit
        run: |
          bash ./scripts/test-xcm-registry-metadata-audit.sh
          bash ./scripts/audit-xcm-registry-metadata.sh --require-executable \
            --write-gap-report build/reports/xcm-registry-gap-report.json \
            --require-route-file scripts/xcm-required-routes.tsv \
            --require-gap-file scripts/xcm-discovery-only-routes.tsv
          bash ./scripts/test-xcm-production-evidence-audit.sh
          bash ./scripts/audit-xcm-production-evidence.sh

      - name: Upload XCM registry gap report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcm-registry-gap-report
          path: build/reports/xcm-registry-gap-report.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Iroha mobile SDK release asset contract
        env:
          GH_TOKEN: ${{ github.token }}
          IROHA_MOBILE_SDK_RELEASE_TAG: ${{ vars.IROHA_MOBILE_SDK_RELEASE_TAG }}
          IROHA_MOBILE_SDK_RELEASE_REPO: ${{ vars.IROHA_MOBILE_SDK_RELEASE_REPO }}
        run: |
          bash ./scripts/check-iroha-mobile-sdk-release-assets.sh --self-test
          if [[ -n "${IROHA_MOBILE_SDK_RELEASE_TAG:-}" ]]; then
            bash ./scripts/check-iroha-mobile-sdk-release-assets.sh --download --tag "$IROHA_MOBILE_SDK_RELEASE_TAG"
          else
            echo "IROHA_MOBILE_SDK_RELEASE_TAG is not configured; real release asset validation skipped."
          fi

      - name: Private overlay audit self-test
        run: bash ./scripts/test-private-overlay-boundary.sh

      - name: Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        run: |
          set -euo pipefail
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          sdkmanager_bin="$(command -v sdkmanager || true)"
          if [[ -z "$sdkmanager_bin" ]]; then
            for candidate in \
              "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
              "$ANDROID_SDK_ROOT/cmdline-tools/bin/sdkmanager" \
              "$ANDROID_SDK_ROOT/tools/bin/sdkmanager"; do
              if [[ -x "$candidate" ]]; then
                sdkmanager_bin="$candidate"
                break
              fi
            done
          fi
          if [[ -z "$sdkmanager_bin" ]]; then
            echo "sdkmanager not found under ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >&2
            exit 1
          fi

          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;28.0.12674087" \
            "ndk;25.2.9519653"

      - name: Export NDK environment
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.12674087" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/28.0.12674087" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/28.0.12674087" >> $GITHUB_ENV

      - name: NDK revision
        run: |
          echo "== NDK (HOME) =="
          cat "$ANDROID_NDK_HOME/source.properties" || true
          echo "== Installed NDKs =="
          ls -1 "$ANDROID_SDK_ROOT/ndk" || true

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add \
            aarch64-linux-android \
            armv7-linux-androideabi \
            i686-linux-android \
            x86_64-linux-android

      - name: Gradle version
        run: ./gradlew --version --no-daemon --console=plain --stacktrace

      - name: Polkadot SDK alignment
        run: ./gradlew printPolkadotSdkAlignment --no-daemon --console=plain --stacktrace

      - name: Static analysis (detekt)
        run: ./gradlew detektAll --no-daemon --console=plain --stacktrace

      - name: Unit tests + coverage
        run: ./gradlew runTest --no-daemon --console=plain --stacktrace

      - name: Android Lint (app)
        run: ./gradlew :app:lint --no-daemon --console=plain --stacktrace

      - name: Gradle/AGP versions
        run: |
          echo "== Gradle =="
          ./gradlew --version --no-daemon --console=plain || true
          echo "\n== Android Gradle Plugin (declared) =="
          grep -E '^android_plugin\s*=\s*"[0-9]+' gradle/libs.versions.toml || true

      - name: Assemble debug to produce native libs
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain --stacktrace

      - name: readelf sanity (native libs)
        run: |
          if ! command -v readelf >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y binutils
          fi
          set +e
          echo "== Scanning native libraries (.so) =="
          mapfile -t sos < <(find app/build -type f -name "*.so" | head -n 10)
          if [ ${#sos[@]} -eq 0 ]; then echo "No native libs found under app/build"; exit 0; fi
          for so in "${sos[@]}"; do
            echo "\n-- $so --"
            readelf -l "$so" | sed -n '1,120p' || true
          done
