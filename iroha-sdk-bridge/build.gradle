import java.security.MessageDigest
import org.gradle.api.artifacts.dsl.LockMode

apply plugin: 'java-library'

def irohaSdkVersion = '2.0.0-rc.2.1-fearless-mobile-sdk.3'
def irohaSdkRepository = rootProject.layout.buildDirectory.dir('iroha-mobile-sdk/maven')

if (!gradle.ext.fearlessDependencyProvenanceRequired) {
    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = 'materializedIrohaMobileSdk'
                    url = irohaSdkRepository
                    metadataSources {
                        gradleMetadata()
                        mavenPom()
                        artifact()
                    }
                }
            }
            filter {
                includeGroup 'org.hyperledger.iroha.sdk'
            }
        }
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

dependencies {
    // The transfer path uses adaptive, uncompressed Norito and no offline JSON
    // models. Keep the upstream dependency non-transitive so zstd native code,
    // Kotlin 2.3, and kotlinx-serialization 1.10 cannot enter the app graph.
    implementation("org.hyperledger.iroha.sdk:core-jvm:${irohaSdkVersion}") {
        transitive = false
    }
    implementation('org.bouncycastle:bcprov-jdk18on:1.78.1') {
        transitive = false
    }
    implementation('org.jetbrains.kotlin:kotlin-stdlib:2.1.10') {
        transitive = false
    }

    testImplementation libs.junit
}

dependencyLocking {
    lockMode = LockMode.STRICT
    lockAllConfigurations()
}

def expectedRuntimeArtifacts = [
        'org.bouncycastle:bcprov-jdk18on:1.78.1':
                'add5915e6acfc6ab5836e1fd8a5e21c6488536a8c1f21f386eeb3bf280b702d7',
        'org.hyperledger.iroha.sdk:core-jvm:2.0.0-rc.2.1-fearless-mobile-sdk.3':
                '33f449700948641c73eeaa4e4a8ab9e39d3d6a642a50b6b7d8c30a9f6aff19ce',
        'org.jetbrains.kotlin:kotlin-stdlib:2.1.10':
                '5f2ac1ca8dc8b37a3f4314e716d36969ebf0227a75181d32699d0a8f645b1c21'
]

tasks.register('verifyIrohaBridgeRuntime') {
    group = 'verification'
    description = 'Verifies the staged Iroha bridge runtime is checksum-pinned and native-free.'

    doLast {
        def artifacts = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts
        def actual = artifacts.groupBy { artifact ->
            def id = artifact.moduleVersion.id
            "${id.group}:${id.name}:${id.version}".toString()
        }

        if (actual.keySet() != expectedRuntimeArtifacts.keySet()) {
            throw new GradleException(
                    "Unexpected Iroha bridge runtime graph. Expected ${expectedRuntimeArtifacts.keySet()}, got ${actual.keySet()}"
            )
        }
        if (artifacts.size() != expectedRuntimeArtifacts.size()) {
            throw new GradleException(
                    "Unexpected Iroha bridge runtime artifact count: expected ${expectedRuntimeArtifacts.size()}, got ${artifacts.size()}"
            )
        }

        actual.each { coordinate, coordinateArtifacts ->
            if (coordinateArtifacts.size() != 1) {
                throw new GradleException(
                        "Expected exactly one runtime file for ${coordinate}, got ${coordinateArtifacts*.file}"
                )
            }
            def file = coordinateArtifacts[0].file
            def digest = MessageDigest.getInstance('SHA-256').digest(file.bytes).encodeHex().toString()
            if (digest != expectedRuntimeArtifacts[coordinate]) {
                throw new GradleException(
                        "Checksum mismatch for ${coordinate}: expected ${expectedRuntimeArtifacts[coordinate]}, got ${digest}"
                )
            }

            def lowerName = file.name.toLowerCase(Locale.ROOT)
            if (lowerName.endsWith('.aar') || lowerName.contains('client-android') ||
                    lowerName.contains('offline-wallet') || lowerName.contains('zstd')) {
                throw new GradleException("Forbidden Android/native artifact in Iroha bridge runtime: ${file}")
            }

            if (lowerName.endsWith('.jar')) {
                new java.util.zip.ZipFile(file).withCloseable { zip ->
                    def forbidden = zip.entries().find { entry ->
                        def name = entry.name.toLowerCase(Locale.ROOT)
                        name.endsWith('.so') || name.contains('libconnect_norito_bridge')
                    }
                    if (forbidden != null) {
                        throw new GradleException(
                                "Forbidden native entry ${forbidden.name} in ${coordinate}"
                        )
                    }
                }
            }
        }
    }
}

tasks.named('compileJava').configure {
    // Resolve and hash the entire deliberately tiny external graph before any
    // upstream bytecode is placed on javac's executable compile path.
    dependsOn tasks.named('verifyIrohaBridgeRuntime')
}

tasks.named('check').configure {
    dependsOn tasks.named('verifyIrohaBridgeRuntime')
}
