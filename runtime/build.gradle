apply plugin: 'com.android.library'
apply plugin: 'dagger.hilt.android.plugin'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'kotlin-parcelize'

android {
    compileSdkVersion rootProject.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion rootProject.targetSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // Allow overriding runtime/type sources to align with specific Polkadot SDK releases
        def TYPES_URL_DEFAULT = "https://raw.githubusercontent.com/soramitsu/shared-features-utils/master/chains/all_chains_types_android.json"
        def DEFAULT_V13_TYPES_URL_DEFAULT = "https://raw.githubusercontent.com/soramitsu/shared-features-utils/master/chains/default_v13_types.json"
        def typesUrl = readOptionalSecret("TYPES_URL_OVERRIDE") ?: TYPES_URL_DEFAULT
        def defaultV13TypesUrl = readOptionalSecret("DEFAULT_V13_TYPES_URL_OVERRIDE") ?: DEFAULT_V13_TYPES_URL_DEFAULT
        buildConfigField "String", "TYPES_URL", "\"${typesUrl}\""
        buildConfigField "String", "DEFAULT_V13_TYPES_URL", "\"${defaultV13TypesUrl}\""
    }

    buildTypes {
        debug {
            def CHAINS_URL_DEBUG_DEFAULT = "https://raw.githubusercontent.com/soramitsu/shared-features-utils/develop-free/chains/v13/chains_dev_prod.json"
            def chainsUrlDebug = readOptionalSecret("CHAINS_URL_DEBUG_OVERRIDE") ?: (readOptionalSecret("CHAINS_URL_OVERRIDE") ?: CHAINS_URL_DEBUG_DEFAULT)
            buildConfigField "String", "CHAINS_URL", "\"${chainsUrlDebug}\""
        }

        release {
            def CHAINS_URL_RELEASE_DEFAULT = "https://raw.githubusercontent.com/soramitsu/shared-features-utils/master/chains/v13/chains.json"
            def chainsUrlRelease = readOptionalSecret("CHAINS_URL_RELEASE_OVERRIDE") ?: (readOptionalSecret("CHAINS_URL_OVERRIDE") ?: CHAINS_URL_RELEASE_DEFAULT)
            buildConfigField "String", "CHAINS_URL", "\"${chainsUrlRelease}\""
        }
    }

    buildFeatures {
        buildConfig = true
    }

    // Resolve duplicate META-INF resources in androidTest packaging (e.g., JUnit Jupiter artifacts)
    packaging {
        resources {
            excludes += [
                    "META-INF/LICENSE.md",
                    "META-INF/LICENSE-notice.md",
                    "META-INF/LICENSE*",
                    "META-INF/NOTICE*",
                    "META-INF/AL2.0",
                    "META-INF/LGPL2.1",
                    // Versioned META-INF resources from multi-release jars (e.g., BouncyCastle, jspecify)
                    "META-INF/versions/**"
            ]
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21.toString()

    }
    namespace = 'jp.co.soramitsu.runtime'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation project(":common")
    implementation project(":core-db")

    implementation project(":core-api")

    implementation libs.gson
    implementation libs.kotlinx.serialization.json

    implementation libs.kotlin.stdlib.jdk7

    implementation libs.coroutines.core
    implementation libs.lifecycle.livedata.ktx

    implementation libs.retrofit

    implementation libs.hilt.android
    ksp libs.hilt.compiler

    testImplementation project(':test-shared')
    testImplementation libs.soramitsu.android.foundation
    testImplementation libs.arch.core.testing

    androidTestImplementation libs.runner
    androidTestImplementation libs.rules
    androidTestImplementation libs.ext.junit

    api libs.sharedFeaturesCoreDep

    implementation libs.web3jDep
    implementation libs.bundles.ton
}
