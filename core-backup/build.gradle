apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'kotlinx-serialization'

android {
    namespace = 'jp.co.soramitsu.shared_features.backup'
    compileSdkVersion rootProject.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion rootProject.targetSdkVersion
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21.toString()
    }

    sourceSets {
        // Public synthetic protocol vector only; never production wallet material.
        androidTest.assets.srcDirs += files("$projectDir/src/test/resources")
    }

    packaging {
        resources {
            // Duplicate JVM multi-release metadata is not consumed by Android.
            excludes += ["META-INF/versions/**"]
        }
    }
}

// Google Drive backup talks to Google's OAuth 2.0 and Drive v3 REST endpoints itself, over OkHttp
// and Gson. No Google Play services, Play Core, Firebase or Google API client library is used.
dependencies {
    api libs.kotlin.stdlib.jdk7
    api libs.activity
    // Open-source AndroidX Credential Manager; the passkey ceremony uses it on Android 14+ only.
    api libs.credentials
    implementation libs.coroutines.core
    implementation libs.gson
    implementation libs.okhttp
    api project(':core-api')

    testImplementation libs.junit
    testImplementation libs.kotlinx.coroutines.test
    testImplementation libs.mockito.kotlin
    androidTestImplementation libs.runner
    androidTestImplementation libs.ext.junit
}

// Child JVMs exercise process crashes and OS file locking without relying on Gradle's worker classloader shape.
tasks.withType(Test).configureEach {
    doFirst {
        systemProperty 'fearless.backup.journal.testClasspath', classpath.asPath
    }
}
