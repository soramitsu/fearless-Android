Properties localProperties = new Properties()

def localPropertiesFile = project.rootProject.file('local.properties')

if (localPropertiesFile.exists()) {
    localProperties.load(localPropertiesFile.newDataInputStream())
}

ext.readSecret = { secretName ->
    def localPropSecret = localProperties.getProperty(secretName)
    def secret = (localPropSecret != null) ? localPropSecret : System.getenv(secretName)
    if (secret == null) {
        println("Warning: Secret '${secretName}' is not defined in local.properties or as an environment variable.")
    }
    return secret
}

ext.readSecretInQuotes = { secretName ->
    def secret = readSecret(secretName)
    return maybeWrapInQuotes(secret)
}

static def maybeWrapInQuotes(content){
    if (content == null) {
        // When a secret is missing, return an empty string literal to keep generated code valid
        return "\"\""
    }

    return content.startsWith("\"") ? content : "\"" + content + "\""
}
