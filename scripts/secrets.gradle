Properties localProperties = new Properties()

def localPropertiesFile = project.rootProject.file('local.properties')

if (localPropertiesFile.exists()) {
    localProperties.load(localPropertiesFile.newDataInputStream())
}

ext.readSecret = { secretName ->
    def localPropSecret = localProperties.getProperty(secretName)
    def secret = (localPropSecret != null) ? localPropSecret : System.getenv(secretName)
    if (secret == null) {
        println("Warning: Secret '${secretName}' is not defined in local.properties or as an environment variable.")
    } else if (secret.trim().isEmpty()) {
        // CI passes an unset repository secret as an empty environment variable.
        println("Warning: Secret '${secretName}' is blank in local.properties or the environment.")
    }
    return secret
}

ext.readOptionalSecret = { secretName ->
    def localPropSecret = localProperties.getProperty(secretName)
    return (localPropSecret != null) ? localPropSecret : System.getenv(secretName)
}

ext.readOptionalSecretInQuotes = { secretName ->
    def secret = readOptionalSecret(secretName)
    return maybeWrapInQuotes(secret)
}

ext.readSecretInQuotes = { secretName ->
    def secret = readSecret(secretName)
    return maybeWrapInQuotes(secret)
}

static def maybeWrapInQuotes(content){
    if (content == null) {
        // When a secret is missing, return an empty string literal to keep generated code valid
        return "\"\""
    }

    return content.startsWith("\"") ? content : "\"" + content + "\""
}

// Google Drive backup signs in with this public OAuth client id (installed-app clients have no
// secret). Unset or blank means the Drive backup project's iOS client, whose custom-scheme redirect
// Google accepts from Android with PKCE. To move Android to its own client, register an Android
// client with custom URI schemes enabled in project 621183184145 (where existing backups are kept)
// and set GOOGLE_DRIVE_OAUTH_CLIENT_ID; the build refuses clients of any other project.
ext.DEFAULT_GOOGLE_DRIVE_OAUTH_CLIENT_ID = "621183184145-jla1mrbl3soobt85btt2nebon8s3d30b.apps.googleusercontent.com"
ext.GOOGLE_DRIVE_BACKUP_PROJECT_NUMBER = "621183184145"

ext.googleDriveOAuthClientId = { ->
    def configured = readOptionalSecret("GOOGLE_DRIVE_OAUTH_CLIENT_ID")
    def clientId = (configured == null || configured.trim().isEmpty()) ? DEFAULT_GOOGLE_DRIVE_OAUTH_CLIENT_ID : configured.trim()
    def match = clientId =~ /^([0-9]{1,20})-[0-9a-z]{1,64}\.apps\.googleusercontent\.com$/
    if (!match.matches()) {
        throw new GradleException("GOOGLE_DRIVE_OAUTH_CLIENT_ID must be a Google OAuth client id.")
    }
    if (match.group(1) != GOOGLE_DRIVE_BACKUP_PROJECT_NUMBER) {
        throw new GradleException(
            "GOOGLE_DRIVE_OAUTH_CLIENT_ID must belong to project ${GOOGLE_DRIVE_BACKUP_PROJECT_NUMBER}, " +
                "where existing Google Drive wallet backups are kept."
        )
    }
    return clientId
}

// Google's custom URI scheme for an installed-app client: the client id with its labels reversed.
ext.googleDriveOAuthRedirectScheme = { String clientId ->
    return "com.googleusercontent.apps." + clientId.substring(0, clientId.length() - ".apps.googleusercontent.com".length())
}
