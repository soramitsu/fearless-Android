// Appearance is compiled into the artifact. Never read wallet state or remote configuration here.
def surfaces = [
    'RECOVERY', 'PORTFOLIO', 'MANAGE_ASSETS', 'SEND', 'RECEIVE', 'PICKERS',
    'UNAVAILABLE', 'SIGNING', 'WELCOME', 'APPEARANCE', 'NAVIGATION', 'MNEMONIC', 'STAKING', 'LOADING',
    'PIN', 'ASSET_DETAILS', 'HISTORY', 'SETTINGS'
]
def palette = providers.gradleProperty('FW_PALETTE').getOrElse('legacy')
if (!(palette in ['legacy', 'v1'])) {
    throw new GradleException('FW_PALETTE must be exactly legacy or v1')
}
def knownFlags = surfaces.collect { "FW_RESTYLE_${it}".toString() }
def unknownFlags = project.properties.keySet().findAll {
    it.startsWith('FW_RESTYLE_') && !(it in knownFlags)
}
if (!unknownFlags.isEmpty()) {
    throw new GradleException("Unknown appearance flags: ${unknownFlags.sort().join(', ')}")
}
def flags = knownFlags.collectEntries { name ->
    def value = providers.gradleProperty(name).getOrElse('false')
    if (!(value in ['true', 'false'])) {
        throw new GradleException("${name} must be exactly true or false")
    }
    [(name): value]
}
android.buildFeatures.resValues = true
android.defaultConfig {
    buildConfigField 'String', 'FW_PALETTE', "\"${palette}\""
    flags.each { name, value -> buildConfigField 'boolean', name, value }
    // Page and window art follow the palette too, so FW_PALETTE=legacy also restores XML screens.
    resValue 'drawable', 'fw_page_background', palette == 'v1' ? '@drawable/fw_page_sunlit' : '@drawable/drawable_background_image'
    resValue 'drawable', 'fw_window_background', palette == 'v1' ? '@drawable/fw_splash_sunlit' : '@drawable/bg_splash'
    resValue 'drawable', 'fw_root_background', palette == 'v1' ? '@drawable/fw_page_sunlit' : '@color/black'
    // Transparent lets the window's page light run behind the navigation bar instead of ending in a black strip.
    resValue 'color', 'fw_navigation_bar', palette == 'v1' ? '@android:color/transparent' : '@color/black'
    // Android paints no bar colour behind a floating window, which left a dark strip under these sheets.
    resValue 'bool', 'fw_sheet_window_floating', palette == 'v1' ? 'false' : 'true'
    // XML list sheets: the legacy near-black is translucent, which lets the lit page's rows show through.
    resValue 'color', 'fw_list_sheet_background', palette == 'v1' ? '@color/fw_surface_raised2' : '@color/bottom_bar_grey'
}
