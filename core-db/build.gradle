apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'dagger.hilt.android.plugin'

android {
    compileSdkVersion rootProject.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion rootProject.targetSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation":
                                      "$projectDir/schemas".toString()]
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21.toString()
    }

    sourceSets {
        androidTest.assets.srcDirs += files("$projectDir/schemas".toString())
        // Exercise the same SR25519 implementation shipped by the production
        // app when running migration integrity tests from this library module.
        androidTest.jniLibs.srcDirs += files("$rootDir/app/src/main/jniLibs")
    }

    packaging {
        resources {
            // JVM-only license/notice and multi-release metadata is duplicated
            // across transitive JUnit/BouncyCastle/jspecify artifacts. None of
            // it is consumed at Android runtime, but duplicates otherwise make
            // the migration instrumentation APK impossible to assemble.
            excludes += [
                    "META-INF/LICENSE.md",
                    "META-INF/LICENSE-notice.md",
                    "META-INF/LICENSE*",
                    "META-INF/NOTICE*",
                    "META-INF/AL2.0",
                    "META-INF/LGPL2.1",
                    "META-INF/versions/**"
            ]
        }
    }

    namespace = 'jp.co.soramitsu.core_db'
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation project(":common")
    implementation libs.gson
    implementation libs.kotlin.stdlib.jdk7

    implementation libs.coroutines.core

    implementation libs.hilt.android
    ksp libs.hilt.compiler

    implementation libs.room.runtime
    implementation libs.room.ktx
    implementation libs.ton.crypto
    implementation libs.ton.tonapi
    ksp libs.room.compiler

    androidTestImplementation libs.runner
    androidTestImplementation libs.rules
    androidTestImplementation libs.ext.junit

    androidTestImplementation libs.room.testing
    androidTestImplementation projects.testShared
    testImplementation libs.junit
    testImplementation projects.testShared
}
