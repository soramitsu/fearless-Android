apply plugin: 'com.android.library'
apply plugin: 'dagger.hilt.android.plugin'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'kotlin-parcelize'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply from: '../tests.gradle'
apply from: '../scripts/secrets.gradle'

android {
    compileSdkVersion rootProject.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion rootProject.targetSdkVersion

        testInstrumentationRunner "android.support.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "RAMP_TOKEN", readOptionalSecretInQuotes("RAMP_TOKEN_DEBUG")
        buildConfigField "String", "RAMP_HOST", "\"ri-widget-staging.firebaseapp.com\""

        buildConfigField "String", "COINBASE_HOST", "\"pay.coinbase.com/buy/select-asset\""
        buildConfigField "String", "COINBASE_APP_ID", readOptionalSecretInQuotes("COINBASE_APP_ID")

        buildConfigField "String", "MOONPAY_PRIVATE_KEY", readSecretInQuotes("MOONPAY_TEST_SECRET")
        buildConfigField "String", "MOONPAY_HOST", "\"buy-staging.moonpay.com\""
        buildConfigField "String", "MOONPAY_PUBLIC_KEY", readOptionalSecretInQuotes("MOONPAY_TEST_PUBLIC_KEY")

        buildConfigField "String", "SCAM_DETECTION_CONFIG", "\"https://raw.githubusercontent.com/soramitsu/shared-features-utils/master/scamDetection/Polkadot_Hot_Wallet_Attributions.csv\""
    }

    buildTypes {
        release {
            buildConfigField "String", "RAMP_TOKEN", readOptionalSecretInQuotes("RAMP_TOKEN_RELEASE")
            buildConfigField "String", "RAMP_HOST", "\"app.ramp.network\""

            buildConfigField "String", "MOONPAY_PRIVATE_KEY", readSecretInQuotes("MOONPAY_PRODUCTION_SECRET")
            buildConfigField "String", "MOONPAY_PUBLIC_KEY", readOptionalSecretInQuotes("MOONPAY_PRODUCTION_PUBLIC_KEY")
            buildConfigField "String", "MOONPAY_HOST", "\"buy.moonpay.com\""
        }
    }

    buildFeatures {
        viewBinding = true
        compose = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21.toString()
    }

    namespace = 'jp.co.soramitsu.feature_wallet_impl'
}

dependencies {
    implementation project(':core-db')
    implementation project(':common')
    implementation project(':feature-wallet-api')
    implementation project(':feature-polkaswap-api')
    implementation project(':feature-account-api')
    implementation project(':feature-account-impl')
    implementation project(':runtime')
    implementation project(':runtime-permission')
    implementation project(':feature-nft-api')
    implementation project(':feature-walletconnect-api')
    implementation project(':feature-tonconnect-api')

    implementation platform(libs.reownBomDep)
    // Exclude JNA (and WalletConnect Pay) from Reown libraries to prevent duplicate natives and page-size incompatible libs
    implementation libs.reownCoreDep, withoutJna
    implementation libs.reownWalletKitDep, withoutJnaAndPay

    implementation libs.kotlin.stdlib.jdk7

    implementation libs.appcompat
    implementation libs.material
    implementation libs.cardview
    implementation libs.constraintlayout

    implementation libs.coroutines.core
    implementation libs.coroutines.android
    implementation libs.kotlinx.coroutines.rx2
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.runtime.ktx

    implementation libs.fragmentKtx

    implementation libs.hilt.android
    implementation libs.legacy.support.v4
    ksp libs.hilt.compiler

    implementation libs.room.runtime
    ksp libs.room.compiler

    ksp libs.lifecycle.compiler

    implementation libs.bouncycastle

    testImplementation libs.junit
    testImplementation libs.mockito.inline
    testImplementation project(':test-shared')
    testImplementation libs.arch.core.testing

    implementation libs.gson
    implementation libs.retrofit

    implementation libs.nv.websocket.client
    implementation libs.xnetworking.lib.android

    implementation libs.zxing.core
    implementation libs.zxing.embedded

    implementation libs.insetter.widgets

    // JNA is added as direct dependency to prevent class duplication from 3rd party libraries
    implementation libs.jna
    // Exclude JNA from beacon SDK to prevent class duplication - using direct JNA dependency above
    implementation libs.beacon.android.sdk, withoutJna


    implementation(libs.converter.gson)
    implementation(libs.converter.scalars)

    implementation libs.shimmer

    implementation libs.bundles.compose
    debugImplementation libs.bundles.composeDebug

    implementation libs.opencsv

    implementation libs.navigation.fragment.ktx
    implementation libs.navigation.ui.ktx

    implementation libs.sharedFeaturesXcmDep
    implementation libs.sharedFeaturesBackupDep
    implementation(libs.soramitsu.android.foundation)

    implementation libs.web3jDep
    implementation libs.bundles.ton
}
