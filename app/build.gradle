//file:noinspection GroovyImplicitNullArgumentCall
import com.github.triplet.gradle.androidpublisher.ReleaseStatus
import groovy.json.JsonSlurper
import java.nio.file.Files
import java.nio.file.LinkOption
import java.nio.file.StandardCopyOption
import java.nio.file.attribute.PosixFilePermission
import java.security.KeyStore
import java.security.PrivateKey
import java.security.cert.X509Certificate
import java.util.Properties

def internalAppSharingRequested = gradle.startParameter.taskNames.any { requestedTask ->
    requestedTask.toLowerCase(Locale.ROOT).contains("internalappsharing")
}
def releaseGoogleServicesFile = file("src/release/google-services.json")
def generatedIasGoogleServicesFile = file("src/internalAppSharing/google-services.json")

if (internalAppSharingRequested) {
    if (!releaseGoogleServicesFile.isFile() || Files.isSymbolicLink(releaseGoogleServicesFile.toPath())) {
        throw new GradleException(
            "Internal App Sharing requires a regular, non-symlink src/release/google-services.json."
        )
    }
    if (releaseGoogleServicesFile.length() <= 0 || releaseGoogleServicesFile.length() > 65536) {
        throw new GradleException("Release Firebase configuration must be between 1 and 65536 bytes.")
    }
    def releaseFirebaseConfig
    try {
        releaseFirebaseConfig = new JsonSlurper().parse(releaseGoogleServicesFile)
    } catch (Exception failure) {
        throw new GradleException("Release Firebase configuration is not valid JSON.", failure)
    }
    def releaseFirebaseClients = releaseFirebaseConfig?.client
    def matchingReleaseClients = releaseFirebaseClients instanceof List
        ? releaseFirebaseClients.findAll { client ->
            client?.client_info?.android_client_info?.package_name == "jp.co.soramitsu.fearless"
        }
        : []
    if (!(releaseFirebaseConfig?.project_info instanceof Map) || matchingReleaseClients.size() != 1) {
        throw new GradleException(
            "Release Firebase configuration must contain exactly one jp.co.soramitsu.fearless client."
        )
    }

    def expectedIasDirectory = file("src/internalAppSharing").absoluteFile
    def expectedIasParent = file("src").canonicalFile
    if (expectedIasDirectory.parentFile.canonicalFile != expectedIasParent) {
        throw new GradleException("Internal App Sharing generated-source parent must stay inside app/src.")
    }
    if (Files.exists(expectedIasDirectory.toPath(), LinkOption.NOFOLLOW_LINKS) &&
        (!Files.isDirectory(expectedIasDirectory.toPath(), LinkOption.NOFOLLOW_LINKS) ||
            Files.isSymbolicLink(expectedIasDirectory.toPath()))) {
        throw new GradleException("Internal App Sharing generated-source path must be a real directory.")
    }
    Files.createDirectories(expectedIasDirectory.toPath())
    if (expectedIasDirectory.canonicalFile != expectedIasDirectory.absoluteFile) {
        throw new GradleException("Internal App Sharing generated-source directory must not traverse a symlink.")
    }

    def generatedIasPath = generatedIasGoogleServicesFile.toPath()
    def generatedIasAlreadyExists = Files.exists(generatedIasPath, LinkOption.NOFOLLOW_LINKS)
    if (generatedIasAlreadyExists) {
        if (Files.isSymbolicLink(generatedIasPath) ||
            !Files.isRegularFile(generatedIasPath, LinkOption.NOFOLLOW_LINKS)) {
            throw new GradleException("Pre-existing IAS Firebase configuration must be a regular, non-symlink file.")
        }
        if (!Arrays.equals(releaseGoogleServicesFile.bytes, generatedIasGoogleServicesFile.bytes)) {
            throw new GradleException(
                "Refusing to overwrite a divergent pre-existing IAS Firebase configuration."
            )
        }
    }

    // Register cleanup before creation/configuration so plugin or configuration failures cannot
    // strand a generated credential file. An exact stale file is also treated as generated state.
    gradle.buildFinished {
        Files.deleteIfExists(generatedIasPath)
    }
    try {
        if (!generatedIasAlreadyExists) {
            Files.copy(
                releaseGoogleServicesFile.toPath(),
                generatedIasPath,
                StandardCopyOption.REPLACE_EXISTING
            )
        }
        try {
            def ownerOnlyPermissions = EnumSet.of(
                PosixFilePermission.OWNER_READ,
                PosixFilePermission.OWNER_WRITE
            )
            Files.setPosixFilePermissions(generatedIasPath, ownerOnlyPermissions)
            if (Files.getPosixFilePermissions(generatedIasPath) != ownerOnlyPermissions) {
                throw new GradleException("Generated IAS Firebase configuration must have mode 0600.")
            }
        } catch (UnsupportedOperationException ignored) {
            generatedIasGoogleServicesFile.setReadable(false, false)
            generatedIasGoogleServicesFile.setWritable(false, false)
            generatedIasGoogleServicesFile.setExecutable(false, false)
            if (!generatedIasGoogleServicesFile.setReadable(true, true) ||
                !generatedIasGoogleServicesFile.setWritable(true, true) ||
                !generatedIasGoogleServicesFile.canRead() || !generatedIasGoogleServicesFile.canWrite() ||
                generatedIasGoogleServicesFile.canExecute()) {
                throw new GradleException(
                    "Could not restrict generated Internal App Sharing Firebase configuration permissions."
                )
            }
        }
        if (!Files.isRegularFile(generatedIasPath, LinkOption.NOFOLLOW_LINKS) ||
            !Arrays.equals(releaseGoogleServicesFile.bytes, generatedIasGoogleServicesFile.bytes)) {
            throw new GradleException("Generated Internal App Sharing Firebase configuration differs from release.")
        }
    } catch (Exception failure) {
        Files.deleteIfExists(generatedIasPath)
        throw failure
    }
}

