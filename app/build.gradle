def localKeystoreProperties = new Properties()
def localKeystorePropertiesFile = rootProject.file("local.properties")
if (localKeystorePropertiesFile.exists()) {
    localKeystoreProperties.load(localKeystorePropertiesFile.newDataInputStream())
}

def envOrLocalProp = { envKey, propKey ->
    def envValue = System.getenv(envKey)
    if (envValue != null && !envValue.trim().isEmpty()) {
        return envValue
    }
    return localKeystoreProperties.getProperty(propKey)
}

def presentConfigValue = { envKey, propKey ->
    def value = envOrLocalProp(envKey, propKey)
    return value != null && !value.toString().trim().isEmpty() ? value.toString() : null
}

def releaseSigningInputs = [
    CI_KEYSTORE_PATH     : presentConfigValue("CI_KEYSTORE_PATH", "ANDROID_RELEASE_KEYSTORE_PATH"),
    CI_KEYSTORE_PASS     : presentConfigValue("CI_KEYSTORE_PASS", "ANDROID_RELEASE_KEYSTORE_PASSWORD"),
    CI_KEYSTORE_KEY_ALIAS: presentConfigValue("CI_KEYSTORE_KEY_ALIAS", "ANDROID_RELEASE_KEYSTORE_ALIAS"),
    CI_KEYSTORE_KEY_PASS : presentConfigValue("CI_KEYSTORE_KEY_PASS", "ANDROID_RELEASE_KEYSTORE_KEY_PASSWORD")
]
def configuredReleaseKeystore = releaseSigningInputs.CI_KEYSTORE_PATH == null
    ? null
    : (new File(releaseSigningInputs.CI_KEYSTORE_PATH).isAbsolute()
        ? new File(releaseSigningInputs.CI_KEYSTORE_PATH)
        : rootProject.file(releaseSigningInputs.CI_KEYSTORE_PATH))

def requestedPlayTrack = System.getenv("PLAY_TRACK")?.trim()
def requestedPlayReleaseStatus = System.getenv("PLAY_RELEASE_STATUS")?.trim()
def requestedPlayArtifactDir = System.getenv("PLAY_ARTIFACT_DIR")?.trim()
def configuredPlayArtifactDirectory = requestedPlayArtifactDir == null || requestedPlayArtifactDir.isEmpty()
    ? null
    : (new File(requestedPlayArtifactDir).isAbsolute()
        ? new File(requestedPlayArtifactDir)
        : rootProject.file(requestedPlayArtifactDir))
def expectedPlayArtifactDirectory = rootProject.file("build/release-artifact")
def effectivePlayTrack = requestedPlayTrack ?: "internal"
def effectivePlayReleaseStatus = requestedPlayReleaseStatus ?: "draft"
def supportedPlayTracks = ["internal", "alpha", "beta", "production"] as Set
def supportedPlayReleaseStatuses = ["draft", "completed"] as Set

if (!supportedPlayTracks.contains(effectivePlayTrack)) {
    throw new GradleException("PLAY_TRACK must be one of: internal, alpha, beta, production.")
}
if (!supportedPlayReleaseStatuses.contains(effectivePlayReleaseStatus)) {
    throw new GradleException("PLAY_RELEASE_STATUS must be either draft or completed.")
}

android {
    compileSdk rootProject.compileSdkVersion
    defaultConfig {
        applicationId "jp.co.soramitsu.fearless"
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion rootProject.targetSdkVersion
        versionCode computeVersionCode()
        versionName computeVersionName()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }
    signingConfigs {
        playRelease {
            if (configuredReleaseKeystore != null) {
                storeFile configuredReleaseKeystore
            }
            if (releaseSigningInputs.CI_KEYSTORE_PASS != null) {
                storePassword releaseSigningInputs.CI_KEYSTORE_PASS
            }
            if (releaseSigningInputs.CI_KEYSTORE_KEY_ALIAS != null) {
                keyAlias releaseSigningInputs.CI_KEYSTORE_KEY_ALIAS
            }
            if (releaseSigningInputs.CI_KEYSTORE_KEY_PASS != null) {
                keyPassword releaseSigningInputs.CI_KEYSTORE_KEY_PASS
            }
        }
    }

    // Minify is needed for QAs to see app performance as end-users do; devs mostly don't need
    // so, R8D8 shrinker is enabled only for remote builds
    def shouldEnableR8D8 = System.getenv("BRANCH_NAME") != null

    buildTypes {
        debug {
            minifyEnabled shouldEnableR8D8
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            signingConfig signingConfigs.debug

            kotlinOptions {
                freeCompilerArgs ["-Xdebug"]
            }

            //Init firebase
            def localReleaseNotes = releaseNotes()
            def localFirebaseGroup = firebaseGroup()
            firebaseAppDistribution {
                releaseNotes = localReleaseNotes
                groups = localFirebaseGroup
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.playRelease
        }
        // Deliberately distinct from release: this keeps release code, resources, R8/R8D8,
        // and package identity while making the debug signer an explicit IAS-only choice.
        internalAppSharing {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
            versionNameSuffix '-ias'
        }
        staging {
            initWith debug
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
            versionNameSuffix '-staging'
            applicationIdSuffix '.staging'
            //Init firebase
            def localReleaseNotes = releaseNotes()
            def localFirebaseGroup = firebaseGroup()
            firebaseAppDistribution {
                releaseNotes = localReleaseNotes
                groups = localFirebaseGroup
            }
        }
        develop {
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
            versionNameSuffix '-develop'
            applicationIdSuffix '.dev'
            //Init firebase
            def localReleaseNotes = releaseNotes()
            def localFirebaseGroup = firebaseGroup()
            firebaseAppDistribution {
              releaseNotes = localReleaseNotes
              groups = localFirebaseGroup
            }
        }
        pr {
            debuggable = true
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
            versionNameSuffix '-pr'
            applicationIdSuffix '.dev'
            //Init firebase
            def localReleaseNotes = releaseNotes()
            def localFirebaseGroup = firebaseGroup()
            firebaseAppDistribution {
              releaseNotes = localReleaseNotes
              groups = localFirebaseGroup
            }
        }
    }

    buildFeatures {
        viewBinding = true
        compose true
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21.toString()
    }
    kotlin {
        compilerOptions {
            if (System.getProperty("idea.active") == "true") {
                println("Enable coroutine debugging")
                freeCompilerArgs.add("-Xdebug")
            }
        }
    }
    lint {
        disable 'Instantiatable'
        fatal 'CredentialDependency', 'TrustAllX509TrustManager'
        checkReleaseBuilds true
        abortOnError true
    }
    namespace = 'jp.co.soramitsu.app'

    packagingOptions {
        resources.excludes.add("META-INF/**/*")
        resources.excludes.add("META-INF/*")
        resources.excludes.add("META-INF/services/org.w3c.dom.DOMImplementationSourceList")
        resources.excludes.add("META-INF/services/org.xml.sax.driver")

        jniLibs {
            // Force native libs to be extracted at install time so 4 KB-aligned binaries run on 16 KB page devices.
            useLegacyPackaging true
            excludes += ["**/armeabi/**"]
            pickFirsts += ["**/libsr25519java.so", "**/libtoolChecker.so", "**/libsodium.so"]
        }
    }
}

