    namespace = 'jp.co.soramitsu.app'

    packagingOptions {
        // Preserve the historical merge-time exclusion for duplicate nested
        // metadata while explicitly removing the two service descriptors that
        // R8 would otherwise retain after their provider classes are shrunk.
        resources.excludes.add("META-INF/**/*")
        resources.excludes.add("META-INF/*")
        resources.excludes.add("/META-INF/services/org.w3c.dom.DOMImplementationSourceList")
        resources.excludes.add("/META-INF/services/org.xml.sax.driver")

