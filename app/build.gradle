def requireNoSymlinkComponents = { File candidate, String label ->
    def currentPath = candidate.toPath().toAbsolutePath().normalize()
    while (currentPath != null) {
        if (Files.exists(currentPath, LinkOption.NOFOLLOW_LINKS) && Files.isSymbolicLink(currentPath)) {
            throw new GradleException("${label} must not traverse a symlink component.")
        }
        currentPath = currentPath.parent
    }
}

def loadSigningKeyStore = { File storeFile, String password ->
    Exception lastFailure = null
    for (String type : ["JKS", "PKCS12"]) {
        try {
            def keyStore = KeyStore.getInstance(type)
            storeFile.withInputStream { input ->
                keyStore.load(input, password.toCharArray())
            }
            return keyStore
        } catch (Exception failure) {
            lastFailure = failure
        }
    }
    throw new GradleException("Configured release keystore could not be opened as JKS or PKCS12.", lastFailure)
}

def validatePlayReleaseSigning = {
    def missingInputs = releaseSigningInputs.findAll { ignored, value -> value == null }.keySet().sort()
    if (!missingInputs.isEmpty()) {
        throw new GradleException(
            "Play release signing is incomplete; missing explicit inputs: ${missingInputs.join(', ')}. " +
                "Use :app:bundleInternalAppSharing for the intentionally debug-signed IAS bundle."
        )
    }
    if (!configuredReleaseKeystore.isFile() || Files.isSymbolicLink(configuredReleaseKeystore.toPath())) {
        throw new GradleException("CI_KEYSTORE_PATH must identify a regular, non-symlink release keystore file.")
    }
    requireNoSymlinkComponents(configuredReleaseKeystore, "CI_KEYSTORE_PATH")

    def debugSigning = android.signingConfigs.getByName("debug")
    if (debugSigning.storeFile != null &&
        configuredReleaseKeystore.canonicalFile == debugSigning.storeFile.canonicalFile) {
        throw new GradleException("The Android debug keystore cannot sign a Play release artifact.")
    }

    def releaseKeyStore = loadSigningKeyStore(configuredReleaseKeystore, releaseSigningInputs.CI_KEYSTORE_PASS)
    def releaseAlias = releaseSigningInputs.CI_KEYSTORE_KEY_ALIAS
    if (!releaseKeyStore.containsAlias(releaseAlias)) {
        throw new GradleException("Configured release keystore does not contain CI_KEYSTORE_KEY_ALIAS.")
    }

    def releaseKey
    try {
        releaseKey = releaseKeyStore.getKey(
            releaseAlias,
            releaseSigningInputs.CI_KEYSTORE_KEY_PASS.toCharArray()
        )
    } catch (Exception failure) {
        throw new GradleException("CI_KEYSTORE_KEY_PASS could not unlock the configured release key.", failure)
    }
    if (!(releaseKey instanceof PrivateKey)) {
        throw new GradleException("CI_KEYSTORE_KEY_ALIAS must identify a private signing key.")
    }

    def releaseCertificate = releaseKeyStore.getCertificate(releaseAlias)
    if (!(releaseCertificate instanceof X509Certificate)) {
        throw new GradleException("CI_KEYSTORE_KEY_ALIAS must have an X.509 signing certificate.")
    }
    def releaseSubject = releaseCertificate.subjectX500Principal.getName("RFC2253")
    if (releaseSubject.toUpperCase(Locale.ROOT).contains("CN=ANDROID DEBUG")) {
        throw new GradleException("An Android Debug certificate cannot sign a Play release artifact.")
    }

    if (debugSigning.storeFile?.isFile()) {
        try {
            def debugKeyStore = loadSigningKeyStore(debugSigning.storeFile, debugSigning.storePassword)
            def debugCertificate = debugKeyStore.getCertificate(debugSigning.keyAlias)
            if (debugCertificate != null &&
                Arrays.equals(releaseCertificate.encoded, debugCertificate.encoded)) {
                throw new GradleException("The configured Play release certificate is the Android debug certificate.")
            }
        } catch (GradleException failure) {
            throw failure
        } catch (Exception ignored) {
            // Subject and canonical-path checks remain authoritative if no local debug store exists yet.
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def appTasks = taskGraph.allTasks.findAll { task -> task.project == project }
    def releaseArtifactTasks = appTasks.findAll { task ->
        def taskName = task.name.toLowerCase(Locale.ROOT)
        def internalSharingTask = taskName.contains("internalappsharing") || taskName.contains("internalsharing")
        !internalSharingTask && (
            taskName in ["assemblerelease", "bundlerelease", "packagerelease", "signreleasebundle"] ||
                (taskName.contains("release") &&
                    (taskName.contains("bundle") || taskName.contains("package") ||
                        taskName.contains("sign") || taskName.startsWith("publish")))
        )
    }
    if (!releaseArtifactTasks.isEmpty()) {
        validatePlayReleaseSigning()
    }

    def forbiddenIasPublisherTasks = appTasks.findAll { task ->
        def taskName = task.name.toLowerCase(Locale.ROOT)
        def playPublisherTask = task.class.name.contains(".gradle.play.")
        playPublisherTask && taskName.contains("internalappsharing") &&
            (taskName.startsWith("publish") || taskName.startsWith("promote") ||
                taskName.startsWith("upload") || taskName.startsWith("install"))
    }
    if (!forbiddenIasPublisherTasks.isEmpty()) {
        throw new GradleException(
            "The debug-signed internalAppSharing variant is IAS-file-only and must never run a Play publisher task."
        )
    }

    def normalPlayPublishingTasks = appTasks.findAll { task ->
        def taskName = task.name.toLowerCase(Locale.ROOT)
        def playPublisherTask = task.class.name.contains(".gradle.play.")
        def internalSharingTask = taskName.contains("internalsharing")
        playPublisherTask && !internalSharingTask &&
            (taskName.startsWith("publish") || taskName.startsWith("promote"))
    }
    if (!normalPlayPublishingTasks.isEmpty()) {
        validatePlayReleaseSigning()
        if (requestedPlayTrack == null || requestedPlayReleaseStatus == null) {
            throw new GradleException("Play publishing requires explicit PLAY_TRACK and PLAY_RELEASE_STATUS values.")
        }
        def serviceAccountPath = System.getenv("CI_PLAY_KEY")?.trim()
        def serviceAccountFile = serviceAccountPath == null ? null : new File(serviceAccountPath)
        if (serviceAccountFile == null || !serviceAccountFile.isFile() ||
            Files.isSymbolicLink(serviceAccountFile.toPath())) {
            throw new GradleException("CI_PLAY_KEY must identify a regular, non-symlink Play service-account JSON file.")
        }
        requireNoSymlinkComponents(serviceAccountFile, "CI_PLAY_KEY")
        if (requestedPlayArtifactDir == null || requestedPlayArtifactDir.isEmpty()) {
            throw new GradleException("Play publishing requires an explicit PLAY_ARTIFACT_DIR.")
        }
        def playArtifactDirectory = configuredPlayArtifactDirectory
        requireNoSymlinkComponents(playArtifactDirectory, "PLAY_ARTIFACT_DIR")
        if (!playArtifactDirectory.isDirectory()) {
            throw new GradleException("PLAY_ARTIFACT_DIR must identify the verified staged bundle directory.")
        }
        if (playArtifactDirectory.canonicalFile != expectedPlayArtifactDirectory.canonicalFile) {
            throw new GradleException("PLAY_ARTIFACT_DIR must be the root build/release-artifact directory.")
        }
        def serviceAccount
        try {
            serviceAccount = new JsonSlurper().parse(serviceAccountFile)
        } catch (Exception failure) {
            throw new GradleException("CI_PLAY_KEY is not valid JSON.", failure)
        }
        if (serviceAccount?.type != "service_account" ||
            !(serviceAccount?.client_email instanceof String) || serviceAccount.client_email.trim().isEmpty() ||
            !(serviceAccount?.private_key instanceof String) || serviceAccount.private_key.trim().isEmpty()) {
            throw new GradleException("CI_PLAY_KEY must contain a service_account client_email and private_key.")
        }
        if (requestedPlayTrack == "production" &&
            !"true".equalsIgnoreCase(System.getenv("ALLOW_PLAY_PRODUCTION_UPLOAD")?.trim())) {
            throw new GradleException("Production publishing requires ALLOW_PLAY_PRODUCTION_UPLOAD=true.")
        }
    }

    if (appTasks.any { task -> task.name.toLowerCase(Locale.ROOT).contains("internalappsharing") }) {
        logger.lifecycle(
            "Building explicit IAS-only variant: production package identity with release semantics and Android debug signing."
        )
    }
}

tasks.register("verifyInternalAppSharingConfiguration") {
    group = "verification"
    description = "Verifies the ephemeral Release-to-IAS Firebase bridge and cleanup preconditions."

    doLast {
        if (!Files.isRegularFile(generatedIasGoogleServicesFile.toPath(), LinkOption.NOFOLLOW_LINKS) ||
            !Arrays.equals(releaseGoogleServicesFile.bytes, generatedIasGoogleServicesFile.bytes)) {
            throw new GradleException("IAS verification did not observe the exact Release Firebase configuration.")
        }
        try {
            def expectedPermissions = EnumSet.of(
                PosixFilePermission.OWNER_READ,
                PosixFilePermission.OWNER_WRITE
            )
            if (Files.getPosixFilePermissions(generatedIasGoogleServicesFile.toPath()) != expectedPermissions) {
                throw new GradleException("IAS verification requires generated Firebase configuration mode 0600.")
            }
        } catch (UnsupportedOperationException ignored) {
            if (!generatedIasGoogleServicesFile.canRead() || !generatedIasGoogleServicesFile.canWrite() ||
                generatedIasGoogleServicesFile.canExecute()) {
                throw new GradleException("IAS verification observed unsafe generated Firebase permissions.")
            }
        }
        if (providers.gradleProperty("iasVerificationForceFailure").orNull == "true") {
            throw new GradleException("Forced IAS verification failure after generated-file validation.")
        }
    }
}

