def localKeystoreProperties = new Properties()
def localKeystorePropertiesFile = rootProject.file("local.properties")
if (localKeystorePropertiesFile.exists()) {
    localKeystoreProperties.load(localKeystorePropertiesFile.newDataInputStream())
}

def envOrLocalProp = { envKey, propKey ->
    def envValue = System.getenv(envKey)
    if (envValue != null && !envValue.trim().isEmpty()) {
        return envValue
    }
    return localKeystoreProperties.getProperty(propKey)
}

def presentConfigValue = { envKey, propKey ->
    def value = envOrLocalProp(envKey, propKey)
    return value != null && !value.toString().trim().isEmpty() ? value.toString() : null
}

def releaseSigningInputs = [
    storePath    : presentConfigValue("CI_KEYSTORE_PATH", "ANDROID_RELEASE_KEYSTORE_PATH"),
    storePassword: presentConfigValue("CI_KEYSTORE_PASS", "ANDROID_RELEASE_KEYSTORE_PASSWORD"),
    keyAlias     : presentConfigValue("CI_KEYSTORE_KEY_ALIAS", "ANDROID_RELEASE_KEYSTORE_ALIAS"),
    keyPassword  : presentConfigValue("CI_KEYSTORE_KEY_PASS", "ANDROID_RELEASE_KEYSTORE_KEY_PASSWORD")
]
def configuredReleaseKeystore = releaseSigningInputs.storePath == null
    ? null
    : rootProject.file(releaseSigningInputs.storePath)
def unsignedReleaseBuildValue = System.getenv("ANDROID_UNSIGNED_RELEASE_BUILD")
if (unsignedReleaseBuildValue != null && unsignedReleaseBuildValue != "true") {
    throw new GradleException(
        "ANDROID_UNSIGNED_RELEASE_BUILD must be unset or exactly true."
    )
}
def unsignedReleaseBuild = unsignedReleaseBuildValue == "true"
if (unsignedReleaseBuild && System.getenv("CI") != "true") {
    throw new GradleException(
        "ANDROID_UNSIGNED_RELEASE_BUILD=true is restricted to an explicit CI environment."
    )
}
if (unsignedReleaseBuild &&
    releaseSigningInputs.any { ignored, value -> value != null }) {
    throw new GradleException(
        "Unsigned release bundling forbids every release keystore and password input."
    )
}
def injectedSigningProperties = project.properties.keySet().findAll { propertyName ->
    propertyName.toString().startsWith("android.injected.signing.")
}
if (unsignedReleaseBuild && !injectedSigningProperties.isEmpty()) {
    throw new GradleException(
        "Unsigned release bundling forbids injected Android signing properties."
    )
}

def expectedUploadCertificateSha256 =
    "40391092F5B97E782C6528CC571ADF5DBEDFE2D05023BABC7C4E339E584A4A9A"
def requestedReleaseCommit = System.getenv("RELEASE_COMMIT")?.trim()
if (requestedReleaseCommit != null &&
    !(requestedReleaseCommit ==~ /[0-9a-f]{40}/)) {
    throw new GradleException(
        "RELEASE_COMMIT must be an exact lowercase 40-character Git commit."
    )
}
