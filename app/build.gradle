//file:noinspection GroovyImplicitNullArgumentCall
import com.github.triplet.gradle.androidpublisher.ReleaseStatus
import java.util.Properties

apply plugin: 'com.android.application'
apply plugin: 'com.google.gms.google-services'
apply plugin: 'dagger.hilt.android.plugin'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'kotlin-parcelize'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: 'com.google.firebase.appdistribution'
apply plugin: "com.github.triplet.play"
apply from: "../scripts/versions.gradle"

def localKeystoreProperties = new Properties()
def localKeystorePropertiesFile = rootProject.file("local.properties")
if (localKeystorePropertiesFile.exists()) {
    localKeystoreProperties.load(localKeystorePropertiesFile.newDataInputStream())
}

def envOrLocalProp = { envKey, propKey ->
    def envValue = System.getenv(envKey)
    if (envValue != null && !envValue.trim().isEmpty()) {
        return envValue
    }
    return localKeystoreProperties.getProperty(propKey)
}

android {
    compileSdk rootProject.compileSdkVersion
    defaultConfig {
        applicationId "jp.co.soramitsu.fearless"
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion rootProject.targetSdkVersion
        versionCode computeVersionCode()
        versionName computeVersionName()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        ci {
            def keystorePath = envOrLocalProp("CI_KEYSTORE_PATH", "ANDROID_RELEASE_KEYSTORE_PATH")
            def releaseKeystore = rootProject.file("fearless-upload.jks")
            def debugKeystore = rootProject.file("debug-keystore.jks")

            def resolvedStoreFile = null
            if (keystorePath) {
                def candidate = file(keystorePath)
                if (candidate.exists()) {
                    resolvedStoreFile = candidate
                }
            }
            if (resolvedStoreFile == null && releaseKeystore.exists()) {
                resolvedStoreFile = releaseKeystore
            }
            if (resolvedStoreFile == null) {
                resolvedStoreFile = debugKeystore
            }

            storeFile resolvedStoreFile

            storePassword envOrLocalProp("CI_KEYSTORE_PASS", "ANDROID_RELEASE_KEYSTORE_PASSWORD") ?: "00000000"
            keyAlias envOrLocalProp("CI_KEYSTORE_KEY_ALIAS", "ANDROID_RELEASE_KEYSTORE_ALIAS") ?: "fearless"
            keyPassword envOrLocalProp("CI_KEYSTORE_KEY_PASS", "ANDROID_RELEASE_KEYSTORE_KEY_PASSWORD") ?: "00000000"
        }
        debug {
            storeFile file("../debug-keystore.jks")
            storePassword "00000000"
            keyAlias "fearless"
            keyPassword "00000000"
        }
    }

    // Minify is needed for QAs to see app performance as end-users do; devs mostly don't need
    // so, R8D8 shrinker is enabled only for remote builds
    def shouldEnableR8D8 = System.getenv("BRANCH_NAME") != null

    buildTypes {
        debug {
            minifyEnabled shouldEnableR8D8
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            signingConfig signingConfigs.debug

            kotlinOptions {
                freeCompilerArgs ["-Xdebug"]
            }

            //Init firebase
            def localReleaseNotes = releaseNotes()
            def localFirebaseGroup = firebaseGroup()
            firebaseAppDistribution {
                releaseNotes = localReleaseNotes
                groups = localFirebaseGroup
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.ci
        }
        staging {
            initWith debug
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
            versionNameSuffix '-staging'
            applicationIdSuffix '.staging'
            //Init firebase
            def localReleaseNotes = releaseNotes()
            def localFirebaseGroup = firebaseGroup()
            firebaseAppDistribution {
                releaseNotes = localReleaseNotes
                groups = localFirebaseGroup
            }
        }
        develop {
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
            versionNameSuffix '-develop'
            applicationIdSuffix '.dev'
            //Init firebase
            def localReleaseNotes = releaseNotes()
            def localFirebaseGroup = firebaseGroup()
            firebaseAppDistribution {
              releaseNotes = localReleaseNotes
              groups = localFirebaseGroup
            }
        }
        pr {
            debuggable = true
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
            versionNameSuffix '-pr'
            applicationIdSuffix '.dev'
            //Init firebase
            def localReleaseNotes = releaseNotes()
            def localFirebaseGroup = firebaseGroup()
            firebaseAppDistribution {
              releaseNotes = localReleaseNotes
              groups = localFirebaseGroup
            }
        }
    }

    buildFeatures {
        viewBinding = true
        compose true
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21.toString()
    }
    kotlin {
        compilerOptions {
            if (System.getProperty("idea.active") == "true") {
                println("Enable coroutine debugging")
                freeCompilerArgs.add("-Xdebug")
            }
        }
    }
    lint {
        disable 'Instantiatable'
    }
    namespace = 'jp.co.soramitsu.app'

    packagingOptions {
        resources.excludes.add("META-INF/**/*")
        resources.excludes.add("META-INF/*")
        resources.excludes.add("META-INF/services/org.w3c.dom.DOMImplementationSourceList")
        resources.excludes.add("META-INF/services/org.xml.sax.driver")
    }
}

play {
    serviceAccountCredentials = file(System.env.CI_PLAY_KEY ?: "../key/fake.json")
    track = "production"
    releaseStatus = ReleaseStatus.DRAFT
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':core-db')
    implementation project(':common')
    implementation project(':feature-splash')

    implementation project(':feature-onboarding-api')
    implementation project(':feature-onboarding-impl')

    implementation project(':feature-account-api')
    implementation project(':feature-account-impl')

    implementation project(':feature-wallet-api')
    implementation project(':feature-wallet-impl')

    implementation project(':runtime')

    implementation project(':feature-staking-api')
    implementation project(':feature-staking-impl')

    implementation project(':feature-crowdloan-api')
    implementation project(':feature-crowdloan-impl')

    implementation project(':feature-polkaswap-api')
    implementation project(':feature-polkaswap-impl')

    implementation project(':feature-success-api')
    implementation project(':feature-success-impl')

    implementation project(':feature-soracard-api')
    implementation project(':feature-soracard-impl')

    implementation project(':feature-walletconnect-api')
    implementation project(':feature-walletconnect-impl')

    implementation project(':feature-tonconnect-api')
    implementation project(':feature-tonconnect-impl')

    implementation project(':feature-nft-api')
    implementation project(':feature-nft-impl')

    implementation project(':feature-liquiditypools-api')
    implementation project(':feature-liquiditypools-impl')

    implementation libs.kotlin.stdlib.jdk7

    implementation libs.appcompat
    implementation libs.constraintlayout

    implementation libs.zxing.embedded

    implementation libs.navigation.fragment.ktx
    implementation libs.navigation.ui.ktx

    implementation libs.room.runtime

    implementation libs.hilt.android
    ksp libs.hilt.compiler

    implementation libs.lifecycle.process
    ksp libs.lifecycle.compiler

    implementation libs.lifecycle.runtime.ktx
    implementation libs.lifecycle.livedata.ktx

    implementation libs.converter.gson

//    implementation "pl.droidsonroids.gif:android-gif-drawable:1.2.25"

    compileOnly libs.nv.websocket.client

    implementation libs.coroutines.core

    testImplementation project(':test-shared')

    implementation libs.insetter.widgets

    // JNA is added as direct dependency to prevent class duplication from 3rd party libraries
    implementation libs.jna
    // Exclude JNA from beacon SDK to prevent class duplication - using direct JNA dependency above
    implementation libs.beacon.android.sdk, withoutJna

    kspAndroidTest libs.hilt.compiler
    implementation libs.storiesProgressView

    implementation libs.bundles.compose
    debugImplementation libs.bundles.composeDebug

    implementation libs.sora.ui
    implementation(libs.soramitsu.android.foundation)

    implementation platform(libs.reownBomDep)
    // Exclude JNA from Reown libraries to prevent class duplication - using direct JNA dependency above
    implementation libs.reownCoreDep, withoutJna
    implementation libs.reownWalletKitDep, withoutJna

    androidTestImplementation libs.runner
    androidTestImplementation libs.rules
    androidTestImplementation libs.ext.junit
}

tasks.register('printVersion') {
    doLast {
        println "versionName:${computeVersionName()}"
    }
}
