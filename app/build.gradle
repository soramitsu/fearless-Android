def loadSigningKeyStore = { File storeFile, String password ->
    Exception lastFailure = null
    for (String type : ["JKS", "PKCS12"]) {
        try {
            def keyStore = KeyStore.getInstance(type)
            storeFile.withInputStream { input ->
                keyStore.load(input, password.toCharArray())
            }
            return keyStore
        } catch (Exception failure) {
            lastFailure = failure
        }
    }
    throw new GradleException(
        "Configured release keystore could not be opened as JKS or PKCS12.",
        lastFailure
    )
}

def certificateSha256 = { X509Certificate certificate ->
    MessageDigest.getInstance("SHA-256")
        .digest(certificate.encoded)
        .collect { String.format("%02X", it & 0xff) }
        .join()
}

def validateReleaseSigning = {
    def missingInputs = releaseSigningInputs.findAll { ignored, value -> value == null }.keySet().sort()
    if (!missingInputs.isEmpty()) {
        throw new GradleException(
            "Release signing is incomplete; all CI/local release keystore inputs are required."
        )
    }
    if (!configuredReleaseKeystore.isFile() ||
        Files.isSymbolicLink(configuredReleaseKeystore.toPath())) {
        throw new GradleException(
            "CI_KEYSTORE_PATH must identify a regular, non-symlink release keystore."
        )
    }

    def debugSigning = android.signingConfigs.getByName("debug")
    if (debugSigning.storeFile != null &&
        configuredReleaseKeystore.canonicalFile == debugSigning.storeFile.canonicalFile) {
        throw new GradleException("The Android debug keystore cannot sign a Play release.")
    }

    def releaseKeyStore = loadSigningKeyStore(
        configuredReleaseKeystore,
        releaseSigningInputs.storePassword
    )
    if (!releaseKeyStore.containsAlias(releaseSigningInputs.keyAlias)) {
        throw new GradleException("The release keystore does not contain the configured key alias.")
    }
    def releaseKey
    try {
        releaseKey = releaseKeyStore.getKey(
            releaseSigningInputs.keyAlias,
            releaseSigningInputs.keyPassword.toCharArray()
        )
    } catch (Exception failure) {
        throw new GradleException("The configured release key could not be unlocked.", failure)
    }
    if (!(releaseKey instanceof PrivateKey)) {
        throw new GradleException("The configured release alias must identify a private key.")
    }

    def releaseCertificate = releaseKeyStore.getCertificate(releaseSigningInputs.keyAlias)
    if (!(releaseCertificate instanceof X509Certificate)) {
        throw new GradleException("The configured release alias must have an X.509 certificate.")
    }
    try {
        releaseCertificate.checkValidity()
    } catch (Exception failure) {
        throw new GradleException("The configured release certificate is not currently valid.", failure)
    }
    if (certificateSha256(releaseCertificate) != expectedUploadCertificateSha256) {
        throw new GradleException(
            "The release certificate does not match the registered Google Play upload certificate."
        )
    }
}

def validateUnsignedReleaseBundleOutput = {
    def outputDirectory = file("$buildDir/outputs/bundle/release")
    def bundles = outputDirectory.listFiles()?.findAll { candidate ->
        candidate.isFile() &&
            !Files.isSymbolicLink(candidate.toPath()) &&
            candidate.name.endsWith(".aab")
    } ?: []
    if (bundles.size() != 1) {
        throw new GradleException(
            "Unsigned release bundling must produce exactly one regular, non-symlink AAB."
        )
    }

    def archive = new ZipFile(bundles.first())
    try {
        def entryNames = []
        def entries = archive.entries()
        while (entries.hasMoreElements()) {
            entryNames.add(entries.nextElement().name)
        }
        if (entryNames.size() != entryNames.toSet().size()) {
            throw new GradleException(
                "The unsigned release AAB contains duplicate ZIP entries."
            )
        }
        def signatureMetadata = entryNames.findAll { entryName ->
            def upperName = entryName.toUpperCase(Locale.ROOT)
            upperName == "META-INF/MANIFEST.MF" ||
                upperName ==~ /META-INF\/[^\/]+\.(SF|RSA|DSA|EC)/
        }
        if (!signatureMetadata.isEmpty()) {
            throw new GradleException(
                "ANDROID_UNSIGNED_RELEASE_BUILD produced JAR signature metadata."
            )
        }
    } finally {
        archive.close()
    }
    logger.lifecycle(
        "Unsigned release AAB verified as an intermediate only; " +
            "external certificate-pinned signing is still required."
    )
}

tasks.matching { task -> task.name == "bundleRelease" }.configureEach {
    if (unsignedReleaseBuild) {
        doLast {
            validateUnsignedReleaseBundleOutput()
        }
    }
}

gradle.taskGraph.whenReady { taskGraph ->
    def appTasks = taskGraph.allTasks.findAll { task -> task.project == project }
    def resolvedIasTasks = appTasks.findAll { task ->
        task.name.toLowerCase(Locale.ROOT).contains("internalappsharing")
    }
    if (!resolvedIasTasks.isEmpty() &&
        !internalAppSharingBundleRequested &&
        !internalAppSharingVerificationRequested) {
        throw new GradleException(
            "Resolved Internal App Sharing tasks require one exact, fully qualified " +
                "allowed request; abbreviated and partial task names are forbidden."
        )
    }
    def resolvedIasBundleTasks = appTasks.findAll { task ->
        task.path == ":app:bundleInternalAppSharing"
    }
    if (internalAppSharingBundleRequested) {
        if (resolvedIasBundleTasks.size() != 1) {
            throw new GradleException(
                "Internal App Sharing must resolve exactly one :app:bundleInternalAppSharing task."
            )
        }
        def iasBuildType = android.buildTypes.getByName("internalAppSharing")
        def releaseBuildType = android.buildTypes.getByName("release")
        if (iasBuildType.signingConfig != null ||
            iasBuildType.applicationIdSuffix != null ||
            iasBuildType.versionNameSuffix != "-ias" ||
            !iasBuildType.minifyEnabled ||
            !iasBuildType.shrinkResources) {
            throw new GradleException(
                "Internal App Sharing must preserve unsigned release semantics with only the -ias version suffix."
            )
        }
        if (releaseBuildType.signingConfig == null ||
            releaseBuildType.signingConfig.name != "releaseUpload") {
            throw new GradleException(
                "Internal App Sharing must not alter the production release signing configuration."
            )
        }
        logger.lifecycle(
            "Internal App Sharing build output is an unsigned quarantine intermediate: " +
                "release semantics, no Firebase or Google Services input, and exact source binding."
        )
    }
    if (internalAppSharingVerificationRequested &&
        appTasks.count { task ->
            task.path == ":app:verifyInternalAppSharingConfiguration"
        } != 1) {
        throw new GradleException(
            "IAS verification must resolve exactly :app:verifyInternalAppSharingConfiguration."
        )
    }
    def releaseArtifactTasks = appTasks.findAll { task ->
        def taskName = task.name.toLowerCase(Locale.ROOT)
        taskName in [
            "assemblerelease",
            "bundlerelease",
            "packagerelease",
            "packagereleasebundle",
            "packagereleaseuniversalapk",
            "signreleasebundle"
        ]
    }
    if (!releaseArtifactTasks.isEmpty() && requestedReleaseCommit == null) {
        def resolvedTasks = releaseArtifactTasks.collect { task -> task.path }
            .unique()
            .sort()
            .join(", ")
        throw new GradleException(
            "RELEASE_COMMIT is required whenever the resolved task graph can " +
                "produce, sign, install, or publish a release artifact. Resolved: " +
                resolvedTasks
        )
    }

    if (unsignedReleaseBuild) {
        def requestedTasks = gradle.startParameter.taskNames
        if (requestedTasks != [":app:bundleRelease"]) {
            throw new GradleException(
                "ANDROID_UNSIGNED_RELEASE_BUILD=true permits only an exact, " +
                    "source-bound :app:bundleRelease invocation; rejected requested tasks: " +
                    requestedTasks.join(", ")
            )
        }
        def exactUnsignedBundleTask = taskGraph.allTasks.find { task ->
            task.path == ":app:bundleRelease"
        }
        if (exactUnsignedBundleTask == null ||
            android.buildTypes.getByName("release").signingConfig != null) {
            throw new GradleException(
                "Unsigned release bundling must resolve exactly :app:bundleRelease " +
                    "without an Android signing configuration."
            )
        }
    }

    if (!releaseArtifactTasks.isEmpty() && !unsignedReleaseBuild) {
        validateReleaseSigning()
    }
}

tasks.register("verifyInternalAppSharingConfiguration") {
    group = "verification"
    description = "Verifies that IAS builds read no Firebase or Google Services configuration."
    dependsOn(verifyIasDependencyLocks)

    doLast {
        requireNoGoogleServicesConfiguration("IAS verification")

        def forceFailure =
            providers.gradleProperty("iasVerificationForceFailure").orNull
        if (forceFailure != null && forceFailure != "true") {
            throw new GradleException(
                "iasVerificationForceFailure must be unset or exactly true."
            )
        }
        if (forceFailure == "true") {
            throw new GradleException(
                "Forced IAS verification failure after configuration validation."
            )
        }
        logger.lifecycle(
            "IAS configuration verified without Firebase or Google Services inputs; " +
                "Gradle receives no final signer and emits only an unsigned quarantine candidate."
        )
    }
}

