def localKeystoreProperties = new Properties()
def localKeystorePropertiesFile = rootProject.file("local.properties")
if (localKeystorePropertiesFile.exists()) {
    localKeystoreProperties.load(localKeystorePropertiesFile.newDataInputStream())
}

def envOrLocalProp = { envKey, propKey ->
    def envValue = System.getenv(envKey)
    if (envValue != null && !envValue.trim().isEmpty()) {
        return envValue
    }
    return localKeystoreProperties.getProperty(propKey)
}

def presentConfigValue = { envKey, propKey ->
    def value = envOrLocalProp(envKey, propKey)
    return value != null && !value.toString().trim().isEmpty() ? value.toString() : null
}

def releaseSigningInputs = [
    storePath    : presentConfigValue("CI_KEYSTORE_PATH", "ANDROID_RELEASE_KEYSTORE_PATH"),
    storePassword: presentConfigValue("CI_KEYSTORE_PASS", "ANDROID_RELEASE_KEYSTORE_PASSWORD"),
    keyAlias     : presentConfigValue("CI_KEYSTORE_KEY_ALIAS", "ANDROID_RELEASE_KEYSTORE_ALIAS"),
    keyPassword  : presentConfigValue("CI_KEYSTORE_KEY_PASS", "ANDROID_RELEASE_KEYSTORE_KEY_PASSWORD")
]
def configuredReleaseKeystore = releaseSigningInputs.storePath == null
    ? null
    : rootProject.file(releaseSigningInputs.storePath)
def unsignedReleaseBuildValue = System.getenv("ANDROID_UNSIGNED_RELEASE_BUILD")
if (unsignedReleaseBuildValue != null && unsignedReleaseBuildValue != "true") {
    throw new GradleException(
        "ANDROID_UNSIGNED_RELEASE_BUILD must be unset or exactly true."
    )
}
def unsignedReleaseBuild = unsignedReleaseBuildValue == "true"
if (unsignedReleaseBuild && System.getenv("CI") != "true") {
    throw new GradleException(
        "ANDROID_UNSIGNED_RELEASE_BUILD=true is restricted to an explicit CI environment."
    )
}
if (unsignedReleaseBuild &&
    releaseSigningInputs.any { ignored, value -> value != null }) {
    throw new GradleException(
        "Unsigned release bundling forbids every release keystore and password input."
    )
}
def injectedSigningProperties = project.properties.keySet().findAll { propertyName ->
    propertyName.toString().startsWith("android.injected.signing.")
}
if (unsignedReleaseBuild && !injectedSigningProperties.isEmpty()) {
    throw new GradleException(
        "Unsigned release bundling forbids injected Android signing properties."
    )
}

def expectedUploadCertificateSha256 =
    "AD6C1D07BE5DFA8C539E8C9B8BD43DC1C6CF79A839828B10B6F953AD57C1BDE8"
def requestedReleaseCommit = System.getenv("RELEASE_COMMIT")?.trim()
if (requestedReleaseCommit != null &&
    !(requestedReleaseCommit ==~ /[0-9a-f]{40}/)) {
    throw new GradleException(
        "RELEASE_COMMIT must be an exact lowercase 40-character Git commit."
    )
}

def requestedTaskNames = gradle.startParameter.taskNames
def internalAppSharingRequested = requestedTaskNames.any { requestedTask ->
    requestedTask.toLowerCase(Locale.ROOT).contains("internalappsharing")
}
def internalAppSharingBundleRequested =
    requestedTaskNames == [":app:bundleInternalAppSharing"]
def internalAppSharingVerificationRequested =
    requestedTaskNames == [":app:verifyInternalAppSharingConfiguration"]

def iasSourceTreeCommit = null
def iasSourceTreeTree = null

def runCheckedCommand = { List<String> command, String label ->
    def process = new ProcessBuilder(command)
        .directory(rootProject.projectDir)
        .redirectErrorStream(true)
        .start()
    def output = process.inputStream.getText("UTF-8")
    def exitCode = process.waitFor()
    if (exitCode != 0) {
        throw new GradleException("${label} failed: ${output.trim()}")
    }
    output.trim()
}

def iasSourceTreeVerificationCommand = {
    def command = [
        "bash",
        new File(
            rootProject.projectDir,
            "scripts/verify-android-release-source-tree.sh"
        ).absolutePath,
        iasSourceTreeCommit,
        iasSourceTreeTree
    ]
    command
}

def iasCoverageCleanupCommand = [
    "python3",
    new File(
        rootProject.projectDir,
        "scripts/remove-empty-gradle-coverage-directories.py"
    ).absolutePath,
    rootProject.projectDir.canonicalFile.toPath().toString()
]

if (internalAppSharingRequested) {
    if (!internalAppSharingBundleRequested &&
        !internalAppSharingVerificationRequested) {
        throw new GradleException(
            "Internal App Sharing permits only an exact " +
                ":app:bundleInternalAppSharing artifact invocation or the exact " +
                ":app:verifyInternalAppSharingConfiguration verification task; " +
                "rejected requested tasks: ${requestedTaskNames.join(', ')}"
        )
    }

    if (!gradle.startParameter.excludedTaskNames.isEmpty()) {
        throw new GradleException(
            "Internal App Sharing forbids excluded Gradle tasks."
        )
    }

    if (unsignedReleaseBuild) {
        throw new GradleException(
            "Internal App Sharing forbids ANDROID_UNSIGNED_RELEASE_BUILD."
        )
    }
    if (releaseSigningInputs.any { ignored, value -> value != null }) {
        throw new GradleException(
            "Internal App Sharing forbids every release keystore and password input."
        )
    }
    if (!injectedSigningProperties.isEmpty()) {
        throw new GradleException(
            "Internal App Sharing forbids injected Android signing properties."
        )
    }
    def forbiddenIasEnvironment = [
        "ANDROID_IAS_DEBUG_KEYSTORE_PATH",
        "ANDROID_IAS_DEBUG_CERTIFICATE_PATH",
        "ANDROID_IAS_DEBUG_CERT_SHA256",
        "EXPECTED_IAS_DEBUG_CERT_SHA256",
        "ANDROID_RELEASE_KEYSTORE_B64",
        "PLAY_SERVICE_ACCOUNT_JSON_B64",
        "PLAY_SERVICE_ACCOUNT",
        "CI_PLAY_KEY",
        "PLAY_TRACK",
        "PLAY_RELEASE_STATUS",
        "PLAY_ARTIFACT_DIR",
        "ALLOW_PLAY_PRODUCTION_UPLOAD",
        "GOOGLE_SERVICES_RELEASE_PATH",
        "GOOGLE_SERVICES_RELEASE_JSON_B64",
        "ANDROID_RELEASE_FIREBASE_JSON_SHA256",
        "FIREBASE_TOKEN",
        "GOOGLE_APPLICATION_CREDENTIALS",
        "CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE",
        "GIT_DIR",
        "GIT_WORK_TREE",
        "GIT_INDEX_FILE",
        "GIT_OBJECT_DIRECTORY",
        "GIT_ALTERNATE_OBJECT_DIRECTORIES"
    ].findAll { variableName -> System.getenv().containsKey(variableName) }
    if (!forbiddenIasEnvironment.isEmpty()) {
        throw new GradleException(
            "Internal App Sharing forbids final-signer, production-distribution, or Firebase inputs: " +
                forbiddenIasEnvironment.sort().join(", ")
        )
    }

    if (internalAppSharingBundleRequested) {
        if (System.getenv("CI") != "true") {
            throw new GradleException(
                "Internal App Sharing bundling requires CI to be exactly lowercase true."
            )
        }
        if (gradle.startParameter.buildCacheEnabled ||
            !gradle.startParameter.rerunTasks) {
            throw new GradleException(
                "Internal App Sharing bundling requires --no-build-cache and --rerun-tasks."
            )
        }
        if (requestedReleaseCommit == null) {
            throw new GradleException(
                "RELEASE_COMMIT is required for Internal App Sharing bundling."
            )
        }
        def actualCommit = runCheckedCommand(
            ["git", "rev-parse", "HEAD"],
            "IAS source commit verification"
        )
        if (actualCommit != requestedReleaseCommit) {
            throw new GradleException(
                "Internal App Sharing RELEASE_COMMIT must equal the checked-out HEAD."
            )
        }
        iasSourceTreeCommit = actualCommit
        iasSourceTreeTree = runCheckedCommand(
            ["git", "rev-parse", "HEAD^{tree}"],
            "IAS source-tree identity verification"
        )
        if (!(iasSourceTreeTree ==~ /[0-9a-f]{40}/)) {
            throw new GradleException("Internal App Sharing source tree is malformed.")
        }

        def expectedUtilsCommit = System.getenv("FEARLESS_UTILS_COMMIT")?.trim()
        def expectedUtilsTree = System.getenv("FEARLESS_UTILS_EFFECTIVE_TREE")?.trim()
        if (!(expectedUtilsCommit ==~ /[0-9a-f]{40}/) ||
            !(expectedUtilsTree ==~ /[0-9a-f]{40}/)) {
            throw new GradleException(
                "Internal App Sharing requires exact FEARLESS_UTILS_COMMIT and " +
                    "FEARLESS_UTILS_EFFECTIVE_TREE bindings."
            )
        }
        def utilsVerification = runCheckedCommand(
            ["bash", new File(rootProject.projectDir, "scripts/ensure-fearless-utils.sh").absolutePath],
            "IAS fearless-utils source verification"
        )
        def actualUtilsCommitMatches = utilsVerification.readLines().findAll { line ->
            line ==~ /\[fearless-utils\] Imported source at [0-9a-f]{40}/
        }
        def actualUtilsTreeMatches = utilsVerification.readLines().findAll { line ->
            line ==~ /\[fearless-utils\] Effective source tree [0-9a-f]{40}/
        }
        if (actualUtilsCommitMatches.size() != 1 ||
            !actualUtilsCommitMatches.first().endsWith(" at ${expectedUtilsCommit}") ||
            actualUtilsTreeMatches != ["[fearless-utils] Effective source tree ${expectedUtilsTree}"]) {
            throw new GradleException(
                "Internal App Sharing fearless-utils commit/effective-tree binding failed."
            )
        }
        runCheckedCommand(
            iasCoverageCleanupCommand,
            "IAS pre-build bounded coverage cleanup"
        )
        runCheckedCommand(
            iasSourceTreeVerificationCommand(),
            "IAS pre-build source-tree verification"
        )
    }
}

androidComponents {
    beforeVariants(selector().withBuildType("internalAppSharing")) { variantBuilder ->
        // The test-only variant must not enter normal aggregate build graphs.
