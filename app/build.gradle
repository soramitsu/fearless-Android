    gradle.projectsEvaluated {
        // Every plugin has registered its tasks by now.
        requireNoGoogleServicesConfiguration("Internal App Sharing")
    }

    tasks.matching { task ->
        task.name == "bundleInternalAppSharing"
    }.configureEach { task ->
        dependsOn(verifyIasDependencyLocks)
        outputs.cacheIf("IAS release-candidate output must never come from build cache") {
            false
        }
        doLast {
            runCheckedCommand(
                iasCoverageCleanupCommand,
                "IAS post-build bounded coverage cleanup"
            )
            runCheckedCommand(
                iasSourceTreeVerificationCommand(),
                "IAS post-build source-tree verification"
            )
            def expectedUtilsCommit = System.getenv("FEARLESS_UTILS_COMMIT")?.trim()
            def expectedUtilsTree =
                System.getenv("FEARLESS_UTILS_EFFECTIVE_TREE")?.trim()
            def utilsVerification = runCheckedCommand(
                [
                    "bash",
                    new File(
                        rootProject.projectDir,
                        "scripts/ensure-fearless-utils.sh"
                    ).absolutePath
                ],
                "IAS post-build fearless-utils source verification"
            )
            def expectedCommitLine = utilsVerification.readLines().findAll { line ->
                line ==~ /\[fearless-utils\] Imported source at [0-9a-f]{40}/
            }
            def expectedTreeLine = utilsVerification.readLines().findAll { line ->
                line ==~ /\[fearless-utils\] Effective source tree [0-9a-f]{40}/
            }
            if (expectedCommitLine.size() != 1 ||
                !expectedCommitLine.first().endsWith(" at ${expectedUtilsCommit}") ||
                expectedTreeLine != [
