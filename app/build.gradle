def iasDependencyConfigurationPairs = [
    ["hiltAnnotationProcessorRelease", "hiltAnnotationProcessorInternalAppSharing"],
    ["kotlinCompilerPluginClasspathRelease", "kotlinCompilerPluginClasspathInternalAppSharing"],
    ["kspReleaseKotlinProcessorClasspath", "kspInternalAppSharingKotlinProcessorClasspath"],
    ["releaseAnnotationProcessorClasspath", "internalAppSharingAnnotationProcessorClasspath"],
    ["releaseCompileClasspath", "internalAppSharingCompileClasspath"],
    ["releaseRuntimeClasspath", "internalAppSharingRuntimeClasspath"]
]
def verifyIasDependencyLocks = tasks.register(
    "verifyInternalAppSharingDependencyLocks"
) {
    group = "verification"
    description = "Resolves strict IAS locks and proves graph equality with release."
    doLast {
        iasDependencyConfigurationPairs.each { pair ->
            def releaseConfiguration = configurations.findByName(pair[0])
            def iasConfiguration = configurations.findByName(pair[1])
            if (releaseConfiguration == null || iasConfiguration == null ||
                !releaseConfiguration.canBeResolved || !iasConfiguration.canBeResolved) {
                throw new GradleException(
                    "IAS strict dependency configuration is missing: ${pair.join(' / ')}"
                )
            }
            def releaseGraph = releaseConfiguration.incoming.resolutionResult
                .allComponents
                .collect { component ->
                    "${component.id.class.name}:${component.id.displayName}"
                }
                .sort()
            def iasGraph = iasConfiguration.incoming.resolutionResult
                .allComponents
                .collect { component ->
                    "${component.id.class.name}:${component.id.displayName}"
                }
                .sort()
            if (releaseGraph != iasGraph) {
                throw new GradleException(
                    "IAS dependency graph differs from release for ${pair.join(' / ')}."
                )
            }
        }
        logger.lifecycle(
            "IAS strict dependency locks resolved and matched all release graphs."
        )
    }
}

android {
    compileSdk rootProject.compileSdkVersion
    defaultConfig {
        applicationId "jp.co.soramitsu.fearless"
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion rootProject.targetSdkVersion
        versionCode computeVersionCode()
        versionName computeVersionName()
        manifestPlaceholders.releaseCommit = "development"
        // Google's redirect back from the browser sign-in for Drive backup (scripts/secrets.gradle).
        manifestPlaceholders.googleDriveOAuthRedirectScheme =
            googleDriveOAuthRedirectScheme(googleDriveOAuthClientId())
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }
    signingConfigs {
        debug {}
        releaseUpload {
            if (configuredReleaseKeystore != null) {
                storeFile configuredReleaseKeystore
            }
            if (releaseSigningInputs.storePassword != null) {
                storePassword releaseSigningInputs.storePassword
            }
            if (releaseSigningInputs.keyAlias != null) {
                keyAlias releaseSigningInputs.keyAlias
            }
            if (releaseSigningInputs.keyPassword != null) {
                keyPassword releaseSigningInputs.keyPassword
            }
        }
    }

    // Minify is needed for QAs to see app performance as end-users do; devs mostly don't need
    // so, R8D8 shrinker is enabled only for remote builds
    def shouldEnableR8D8 = System.getenv("BRANCH_NAME") != null

    buildTypes {
        debug {
            minifyEnabled shouldEnableR8D8
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            signingConfig signingConfigs.debug

            kotlinOptions {
                freeCompilerArgs ["-Xdebug"]
            }
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (!unsignedReleaseBuild) {
                signingConfig signingConfigs.releaseUpload
            }
            manifestPlaceholders.releaseCommit = requestedReleaseCommit ?: "missing"
        }
        internalAppSharing {
            initWith release
            // The final one-run signer is created only after this Gradle job has
            // ended, on the fresh no-Gradle qualification runner.
            signingConfig null
            matchingFallbacks = ['release']
            versionNameSuffix '-ias'
        }
        staging {
            initWith debug
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
            versionNameSuffix '-staging'
            applicationIdSuffix '.staging'
        }
        develop {
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
            versionNameSuffix '-develop'
            applicationIdSuffix '.dev'
        }
        pr {
            debuggable = true
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
            versionNameSuffix '-pr'
            applicationIdSuffix '.dev'
        }
    }

    sourceSets {
        // One pure oracle is compiled only into local and instrumentation tests.
        test.java.srcDir "src/sharedTest/java"
        androidTest.java.srcDir "src/sharedTest/java"
        internalAppSharing {
            // initWith copies build-type properties, not source-set resources. Reuse the
            // reviewed production launcher assets without creating a mutable IAS source tree.
            res.srcDir "src/release/res"
        }
    }

    buildFeatures {
        viewBinding = true
        compose true
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21.toString()
    }
    kotlin {
        compilerOptions {
            if (System.getProperty("idea.active") == "true") {
                println("Enable coroutine debugging")
                freeCompilerArgs.add("-Xdebug")
            }
        }
    }
    lint {
        disable 'Instantiatable'
        fatal 'CredentialDependency', 'TrustAllX509TrustManager'
        checkReleaseBuilds true
        abortOnError true
    }
    namespace = 'jp.co.soramitsu.app'

    packagingOptions {
        // Preserve the historical merge-time exclusion for duplicate nested
        // metadata while explicitly removing the two service descriptors that
        // R8 would otherwise retain after their provider classes are shrunk.
        resources.excludes.add("META-INF/**/*")
        resources.excludes.add("META-INF/*")
        resources.excludes.add("/META-INF/services/org.w3c.dom.DOMImplementationSourceList")
        resources.excludes.add("/META-INF/services/org.xml.sax.driver")

        jniLibs {
            // Force native libs to be extracted at install time so 4 KB-aligned binaries run on 16 KB page devices.
            useLegacyPackaging true
            excludes += ["**/armeabi/**"]
            pickFirsts += ["**/libsr25519java.so", "**/libtoolChecker.so", "**/libsodium.so"]
        }
    }
}

// Google Play services and Firebase are not part of the app (4.3.2): no build of any type may read a
// Google Services configuration or register its processing task.
def googleServicesConfigurationFiles = {
    fileTree(dir: projectDir, includes: ["google-services.json", "src/*/google-services.json"])
        .files
        .collect { file -> projectDir.toPath().relativize(file.toPath()).toString() }
        .sort()
}
def requireNoGoogleServicesConfiguration = { String label ->
    def configurationFiles = googleServicesConfigurationFiles()
    if (!configurationFiles.isEmpty()) {
        throw new GradleException(
            "${label} forbids Google Services configuration files: ${configurationFiles.join(', ')}"
        )
    }
    def googleServicesTasks = tasks.names.findAll { taskName ->
        taskName.toLowerCase(Locale.ROOT).contains("googleservices")
    }.sort()
    if (!googleServicesTasks.isEmpty()) {
        throw new GradleException(
            "${label} forbids Google Services processing tasks: ${googleServicesTasks.join(', ')}"
        )
    }
}
