# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx5120m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
org.gradle.parallel=true
org.gradle.daemon=true # JVM is not restarted between builds - reduces build time #
org.gradle.caching=true # caching of tasks (such as app:minifyWithR8) #

org.gradle.configuration-cache=true # caching of build.gradle configurations #
# if a task needs to be reassembled (new code added, eg)
# reconfigures only some of dependent upon tasks - reduces build time#
org.gradle.configureondemand=true
org.gradle.dependency.verification=strict
org.gradle.dependency.verification.console=verbose

kapt.incremental.apt=true
dagger.gradle.incremental=true

room.incremental=true

android.useAndroidX=true

android.ndkVersion=28.0.12674087
android.suppressUnsupportedCompileSdk=36
android.nonTransitiveRClass=false
android.nonFinalResIds=false

# Compiled presentation rollback controls. The legacy palette overrides every per-surface flag.
# Enable each surface only with its qualified migration; no flags control wallet or network data.
FW_PALETTE=legacy
FW_RESTYLE_RECOVERY=false
FW_RESTYLE_PORTFOLIO=false
FW_RESTYLE_MANAGE_ASSETS=false
FW_RESTYLE_SEND=false
FW_RESTYLE_RECEIVE=false
FW_RESTYLE_PICKERS=false
FW_RESTYLE_UNAVAILABLE=false
FW_RESTYLE_SIGNING=false
FW_RESTYLE_WELCOME=false
FW_RESTYLE_APPEARANCE=false
FW_RESTYLE_NAVIGATION=false
FW_RESTYLE_MNEMONIC=false
FW_RESTYLE_STAKING=false

FW_RESTYLE_LOADING=false
