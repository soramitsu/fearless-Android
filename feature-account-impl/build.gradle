apply plugin: 'com.android.library'
apply plugin: 'dagger.hilt.android.plugin'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'kotlin-parcelize'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply from: '../tests.gradle'

android {
    compileSdkVersion rootProject.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion rootProject.targetSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        viewBinding = true
        compose true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21.toString()
    }

    sourceSets {
        androidTest.assets.srcDirs += files(
                "$rootDir/core-db/schemas",
                "$rootDir/common/src/test/resources"
        )
        // Exercise the same SR25519 implementation shipped by the production
        // app when validating signing-key routing from this library module.
        androidTest.jniLibs.srcDirs += files("$rootDir/app/src/main/jniLibs")
    }

    packaging {
        resources {
            // JVM-only metadata is duplicated across the transitive
            // instrumentation-test dependencies and is not used on Android.
            excludes += [
                    "META-INF/LICENSE.md",
                    "META-INF/LICENSE-notice.md",
                    "META-INF/LICENSE*",
                    "META-INF/NOTICE*",
                    "META-INF/AL2.0",
                    "META-INF/LGPL2.1",
                    "META-INF/versions/**"
            ]
        }
    }

    namespace = 'jp.co.soramitsu.feature_account_impl'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar', "*.aar"])
    implementation project(':core-db')
    implementation project(':common')
    implementation project(':runtime')
    implementation project(':feature-account-api')
    implementation project(':feature-staking-api')
    implementation project(':feature-wallet-api')
    implementation project(':feature-polkaswap-api')
    implementation libs.kotlin.stdlib.jdk7

    implementation libs.bundles.ton
    implementation libs.appcompat
    implementation libs.core.ktx
    implementation libs.material
    implementation libs.cardview
    implementation libs.constraintlayout

    implementation libs.biometric

    implementation libs.zxing.core
    implementation libs.zxing.embedded

    implementation libs.bouncycastle

    implementation libs.coroutines.core
    implementation libs.coroutines.android

    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.runtime.ktx

    implementation libs.fragmentKtx

    implementation libs.navigation.fragment.ktx
    implementation libs.navigation.ui.ktx

    implementation libs.hilt.android
    ksp libs.hilt.compiler

    implementation libs.room.runtime
    ksp libs.room.compiler

    ksp libs.lifecycle.compiler

    implementation libs.bundles.compose
    debugImplementation libs.bundles.composeDebug

    testImplementation libs.junit
    testImplementation libs.mockito.inline
    testImplementation project(':test-shared')

    androidTestImplementation libs.runner
    androidTestImplementation libs.rules
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.room.testing
    androidTestImplementation project(':test-shared')

    implementation libs.gson

    api libs.sharedFeaturesCoreDep
    implementation libs.soramitsu.android.foundation

    implementation libs.sharedFeaturesBackupDep
    implementation libs.web3jDep
}
