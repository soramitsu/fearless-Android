apply plugin: 'com.android.library'
apply plugin: 'dagger.hilt.android.plugin'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'kotlin-parcelize'
apply plugin: 'kotlinx-serialization'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply from: '../scripts/secrets.gradle'

android {
    compileSdkVersion rootProject.compileSdkVersion

    defaultConfig {
        minSdkVersion rootProject.minSdkVersion
        targetSdkVersion rootProject.targetSdkVersion

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "long", "VERSION_CODE", "${rootProject.versionCode}"
        buildConfigField "String", "VERSION_NAME", "\"${rootProject.versionName}\""

        buildConfigField "String", "POLKASWAP_CONFIG_URL", "\"https://raw.githubusercontent.com/soramitsu/fearless-Android/master/remote-config/production/polkaswapSettings.json\""
        buildConfigField "String", "FEATURE_TOGGLE_URL", "\"https://raw.githubusercontent.com/soramitsu/fearless-Android/master/remote-config/production/appConfigs/feature_toggle\""

        buildConfigField "String", "WEBSITE_URL", "\"https://fearlesswallet.io\""
        buildConfigField "String", "TWITTER_URL", "\"https://twitter.com/fearlesswallet\""
        buildConfigField "String", "YOUTUBE_URL", "\"https://youtube.com/fearlesswallet\""
        buildConfigField "String", "INSTAGRAM_URL", "\"https://instagram.com/fearless_wallet\""
        buildConfigField "String", "MEDIUM_URL", "\"https://medium.com/fearlesswallet\""
        buildConfigField "String", "PRIVACY_URL", "\"https://fearlesswallet.io/privacy\""
        buildConfigField "String", "TERMS_URL", "\"https://fearlesswallet.io/terms\""
        buildConfigField "String", "GITHUB_URL", "\"https://github.com/soramitsu/fearless-Android\""
        buildConfigField "String", "WIKI_URL", "\"https://wiki.fearlesswallet.io\""
        buildConfigField "String", "WIKI_CROWDLOANS_URL", "\"https://wiki.fearlesswallet.io/crowdloans\""
        buildConfigField "String", "TELEGRAM_URL", "\"https://t.me/fearlesswallet\""
        buildConfigField "String", "ANNOUNCEMENT_URL", "\"https://t.me/fearless_announcements\""
        buildConfigField "String", "SUPPORT_URL", "\"https://t.me/fearlesshappiness\""
        buildConfigField "String", "EMAIL", "\"fearless@soramitsu.co.jp\""

        buildConfigField "String", "TWITTER_ACCOUNT_TEMPLATE", "\"https://twitter.com/%s\""

        buildConfigField "String", "PAYOUTS_LEARN_MORE", "\"https://wiki.polkadot.network/docs/learn-staking-advanced\""

        buildConfigField "String", "SET_CONTROLLER_LEARN_MORE", "\"https://wiki.polkadot.network/docs/en/maintain-guides-how-to-nominate-polkadot#setting-up-stash-and-controller-keys\""
        buildConfigField "String", "MOONBEAM_STAKING_LEARN_MORE", "\"https://docs.moonbeam.network/learn/features/staking/#reward-distribution(\""
        buildConfigField "String", "STAKING_POOL_WIKI", "\"https://wiki.polkadot.network/docs/learn-nomination-pools\""
        buildConfigField "String", "POLKADOT_JS_PLUS_EXTENSION", "\"https://polkagate.xyz/\""

        buildConfigField "String", "BLAST_API_ETHEREUM_KEY", readSecretInQuotes("FL_BLAST_API_ETHEREUM_KEY")
        buildConfigField "String", "BLAST_API_BSC_KEY", readSecretInQuotes("FL_BLAST_API_BSC_KEY")
        buildConfigField "String", "BLAST_API_SEPOLIA_KEY", readSecretInQuotes("FL_BLAST_API_SEPOLIA_KEY")
        buildConfigField "String", "BLAST_API_GOERLI_KEY", readSecretInQuotes("FL_BLAST_API_GOERLI_KEY")
        buildConfigField "String", "BLAST_API_POLYGON_KEY", readSecretInQuotes("FL_BLAST_API_POLYGON_KEY")
        buildConfigField "String", "ETHERSCAN_API_KEY", readSecretInQuotes("FL_ANDROID_ETHERSCAN_API_KEY")
        buildConfigField "String", "OKLINK_API_KEY", readSecretInQuotes("FL_ANDROID_OKLINK_API_KEY")
        buildConfigField "String", "KAIASCAN_API_KEY", readSecretInQuotes("FL_ANDROID_KAIASCAN_API_KEY")
        buildConfigField "String", "WALLET_CONNECT_PROJECT_ID", readSecretInQuotes("FL_WALLET_CONNECT_PROJECT_ID")
        buildConfigField "String", "FL_DWELLIR_API_KEY", readSecretInQuotes("FL_DWELLIR_API_KEY")
        buildConfigField "String", "FL_ANDROID_TON_API_KEY", readSecretInQuotes("FL_ANDROID_TON_API_KEY")
        def tonIndexerUrl = readOptionalSecret("FL_ANDROID_TON_INDEXER_URL") ?: "https://ti.soramitsu.io"
        buildConfigField "String", "TON_INDEXER_URL", "\"${tonIndexerUrl}\""
        // TON uses TI only after TI's service-info proves the network. Until then the registry's TON node answers
        // (verified the same way) so TON holders keep balances and sends. Set to false once TI serves TON mainnet.
        def tonRegistryNodeFallback = readOptionalSecret("FL_ANDROID_TON_REGISTRY_NODE_FALLBACK")?.trim()?.toLowerCase() != "false"
        buildConfigField "boolean", "TON_REGISTRY_NODE_FALLBACK", "${tonRegistryNodeFallback}"

        buildConfigField("String", "DAPPS_URL", "\"https://raw.githubusercontent.com/soramitsu/fearless-Android/master/remote-config/development/appConfigs/dapps.json\"")
    }

    buildTypes {
        debug {
            buildConfigField "String", "FIAT_CONFIG_URL", "\"https://raw.githubusercontent.com/soramitsu/fearless-Android/master/remote-config/development/fiat/fiats.json\""

            buildConfigField "String", "WEB_CLIENT_ID", readSecretInQuotes("WEB_CLIENT_ID_DEBUG")
            buildConfigField "String", "APP_CONFIG_URL", "\"https://raw.githubusercontent.com/soramitsu/fearless-Android/master/remote-config/development/appVersionSupport/android_app_support_dev.json\""
        }
        release {
            buildConfigField "String", "FIAT_CONFIG_URL", "\"https://raw.githubusercontent.com/soramitsu/fearless-Android/master/remote-config/production/fiat/fiats.json\""

            buildConfigField "String", "WEB_CLIENT_ID", readSecretInQuotes("WEB_CLIENT_ID_RELEASE")
            buildConfigField "String", "APP_CONFIG_URL", "\"https://raw.githubusercontent.com/soramitsu/fearless-Android/master/remote-config/development/appVersionSupport/android_app_support.json\""
        }
    }

    buildFeatures {
        viewBinding = true
        compose = true
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_21.toString()
    }

    packaging {
        resources {
            // JVM multi-release metadata is duplicated by transitive crypto
            // dependencies but is not used by the Android runtime.
            excludes += ["META-INF/versions/**"]
        }
    }

    sourceSets {
        // Released-secret golden vectors, shared by the JVM and device suites.
        androidTest.assets.srcDirs += files("src/test/resources/wallet-secret-vectors")
        // Validate SR25519 secrets with the library shipped by the production app.
        androidTest.jniLibs.srcDirs += files("$rootDir/app/src/main/jniLibs")
    }

    namespace = 'jp.co.soramitsu.common'
}

apply from: '../scripts/fw-appearance.gradle'

// The colour guard reads other modules and a Git-bound allowlist. Model those
// inputs explicitly so an unchanged common classpath cannot cache away a new
// literal elsewhere in the repository.
def colourSourceRevision = providers.exec {
    workingDir rootProject.projectDir
    commandLine 'git', 'rev-parse', 'HEAD'
}.standardOutput.asText.map { it.trim() }

tasks.withType(Test).configureEach {
    inputs.files(rootProject.fileTree(rootProject.projectDir) {
        include '*/src/**/*.kt', '*/src/**/*.java'
    }).withPropertyName('rawColourSources').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.file(rootProject.file('design/fw.raw-colour-baseline.android.json'))
        .withPropertyName('rawColourBaseline').withPathSensitivity(PathSensitivity.RELATIVE)
    inputs.property('rawColourSourceRevision', colourSourceRevision)
    inputs.property('rawColourBaseRef', providers.environmentVariable('FW_COLOUR_BASE_REF').orElse('HEAD^'))
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    api project(":core-api")
    implementation project(':runtime-permission')

    implementation libs.kotlin.stdlib.jdk7

    implementation libs.core.ktx
    implementation libs.appcompat
    implementation libs.cardview
    implementation libs.recyclerview
    implementation libs.material
    implementation libs.constraintlayout

    implementation libs.bouncycastle

    implementation libs.coroutines.core
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.runtime.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.lifecycle.process
    ksp libs.lifecycle.compiler

    implementation libs.hilt.android
    implementation libs.navigation.fragment.ktx
    ksp libs.hilt.compiler

    implementation libs.play.services.base

    implementation libs.converter.gson
    implementation libs.converter.scalars
    implementation libs.logging.interceptor

    implementation libs.zxing.core
    implementation libs.zxing.embedded

    implementation libs.bundles.ton
    implementation libs.progressbutton

    implementation project(':runtime-websocket')
    implementation project(':core-networking')

    implementation libs.middle.ellipsis.text

    implementation libs.bundles.compose
    debugImplementation libs.bundles.composeDebug

    implementation project(':core-ui')
    implementation project(':core-foundation')
    api libs.coil
    api libs.coil.gif
    api libs.coil.svg

    testImplementation libs.junit
    testImplementation libs.arch.core.testing
    testImplementation libs.mockito.inline
    testImplementation project(':test-shared')

    androidTestImplementation libs.runner
    androidTestImplementation libs.rules
    androidTestImplementation libs.ext.junit

    api project(':core-chain')
}
